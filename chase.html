<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Chase Animation Demo</title>

<style>
body{
  background:#1f1f1f;
  padding:40px;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  color:white;
  font-family:system-ui;
}

/* --- Chase Container --- */
.chase-stack{
  position:relative;
  width:260px;
  height:60px;
  border:1px solid #444;
  background:#222;
  border-radius:10px;
  overflow:hidden;
}

/* --- Dino (simple pixel block version) --- */
.dino{
  position:absolute;
  left:10px;
  top:18px;
  width:48px;
  height:28px;
  background:#4caf50;
  border:3px solid #2e7d32;
  border-radius:4px;
  image-rendering:pixelated;
  animation:
    dinoRun 0.5s steps(2) infinite,
    dinoMove 1.2s ease-in-out infinite;
}

@keyframes dinoRun{
  0%{ transform:scaleX(1); }
  50%{ transform:scaleX(0.9); }
  100%{ transform:scaleX(1); }
}

@keyframes dinoMove{
  0%{ transform:translateX(0); }
  50%{ transform:translateX(6px); }
  100%{ transform:translateX(0); }
}

/* --- Runner (Miner) --- */
.runner{
  position:absolute;
  right:20px;
  top:14px;
  width:32px;
  height:32px;
  background:#f2c9a0;
  border:3px solid #8b5a2b;
  border-radius:4px;
  image-rendering:pixelated;
  animation:runBounce 0.55s steps(2) infinite;
}

@keyframes runBounce{
  0%{ transform:translateY(0); }
  50%{ transform:translateY(-3px); }
  100%{ transform:translateY(0); }
}

/* --- Pickaxe --- */
.pickaxe{
  position:absolute;
  right:52px;
  top:10px;
  width:26px;
  height:6px;
  background:#c9a23a;
  border:2px solid #8b5a2b;
  border-radius:3px;
  transform-origin:right center;
  animation:pickSwing 0.85s steps(3) infinite;
}

@keyframes pickSwing{
  0%{ transform:rotate(-20deg); }
  40%{ transform:rotate(35deg); }
  70%{ transform:rotate(10deg); }
  100%{ transform:rotate(-20deg); }
}
</style>
</head>

<body>

<div class="chase-stack">
  <div class="dino"></div>
  <div class="pickaxe"></div>
  <div class="runner"></div>
</div>

</body>
</html>
