<svg width="300" height="100" viewBox="0 0 300 100"
     xmlns="http://www.w3.org/2000/svg"
     shape-rendering="crispEdges">

  <style>
    .miner { animation: minerBounce 0.6s infinite alternate; }
    @keyframes minerBounce {
      from { transform: translateY(0); }
      to   { transform: translateY(-2px); }
    }

    .pickaxe { animation: pickSwing 0.5s infinite alternate; transform-origin: left center; }
    @keyframes pickSwing {
      from { transform: rotate(-10deg); }
      to   { transform: rotate(20deg); }
    }

    .dino { animation: dinoBob 0.7s infinite alternate; }
    @keyframes dinoBob {
      from { transform: translateY(0); }
      to   { transform: translateY(2px); }
    }
  </style>

  <!-- 배경 -->
  <rect x="0" y="0" width="300" height="100" fill="#1f1f1f" />

  <!-- 땅 -->
  <rect x="0" y="70" width="300" height="30" fill="#3b2a1a" />
  <rect x="0" y="70" width="300" height="4" fill="#5a3a20" />

  <!-- 비트코인 동전 (도트 원 + B 로고) -->
  <g>
    <!-- 도트 원 테두리 -->
    <rect x="46" y="32" width="2" height="2" fill="#c89b1f"/>
    <rect x="48" y="30" width="2" height="2" fill="#c89b1f"/>
    <rect x="52" y="28" width="2" height="2" fill="#c89b1f"/>
    <rect x="56" y="28" width="2" height="2" fill="#c89b1f"/>
    <rect x="60" y="30" width="2" height="2" fill="#c89b1f"/>
    <rect x="62" y="32" width="2" height="2" fill="#c89b1f"/>
    <rect x="64" y="36" width="2" height="2" fill="#c89b1f"/>
    <rect x="64" y="40" width="2" height="2" fill="#c89b1f"/>
    <rect x="62" y="44" width="2" height="2" fill="#c89b1f"/>
    <rect x="60" y="46" width="2" height="2" fill="#c89b1f"/>
    <rect x="56" y="48" width="2" height="2" fill="#c89b1f"/>
    <rect x="52" y="48" width="2" height="2" fill="#c89b1f"/>
    <rect x="48" y="46" width="2" height="2" fill="#c89b1f"/>
    <rect x="46" y="44" width="2" height="2" fill="#c89b1f"/>

    <!-- 안쪽 -->
    <rect x="50" y="32" width="12" height="12" fill="#f2c14e"/>

    <!-- B 로고 (도트) -->
    <rect x="54" y="32" width="2" height="12" fill="#8b5a2b"/>
    <rect x="56" y="32" width="4" height="2" fill="#8b5a2b"/>
    <rect x="56" y="36" width="4" height="2" fill="#8b5a2b"/>
    <rect x="56" y="40" width="4" height="2" fill="#8b5a2b"/>
  </g>

  <!-- 사람 (도트 스타일) -->
  <g class="miner">
    <!-- 다리 -->
    <rect x="120" y="58" width="4" height="12" fill="#2f6fb3"/>
    <rect x="126" y="58" width="4" height="12" fill="#2f6fb3"/>

    <!-- 몸통 -->
    <rect x="118" y="46" width="16" height="12" fill="#1d5a31"/>

    <!-- 머리 -->
    <rect x="120" y="36" width="12" height="10" fill="#f2c9a0"/>

    <!-- 눈 -->
    <rect x="123" y="39" width="2" height="2" fill="#111"/>
    <rect x="128" y="39" width="2" height="2" fill="#111"/>

    <!-- 왼팔 -->
    <rect x="114" y="46" width="4" height="10" fill="#1d5a31"/>

    <!-- 오른팔 (곡갱이 들고 있음) -->
    <rect x="134" y="46" width="4" height="10" fill="#1d5a31"/>
  </g>

  <!-- 곡갱이 (오른손에 정확히 위치) -->
  <g class="pickaxe" transform="translate(138,42)">
    <rect x="0" y="4" width="14" height="3" fill="#8b5a2b"/>
    <rect x="10" y="0" width="6" height="4" fill="#e7e7e7"/>
  </g>

  <!-- 다이노소어 (도트 스타일, 사람을 바라봄) -->
  <g class="dino">
    <!-- 몸통 -->
    <rect x="200" y="45" width="20" height="12" fill="#2e8b4d"/>

    <!-- 꼬리 -->
    <rect x="220" y="47" width="6" height="4" fill="#2e8b4d"/>
    <rect x="226" y="49" width="4" height="4" fill="#2e8b4d"/>

    <!-- 머리 (왼쪽 방향) -->
    <rect x="188" y="42" width="10" height="8" fill="#2e8b4d"/>

    <!-- 입 -->
    <rect x="188" y="48" width="10" height="3" fill="#1d5a31"/>

    <!-- 눈 -->
    <rect x="195" y="43" width="2" height="2" fill="#e7e7e7"/>
    <rect x="196" y="44" width="1" height="1" fill="#111"/>

    <!-- 다리 -->
    <rect x="204" y="57" width="3" height="7" fill="#1d5a31"/>
    <rect x="212" y="57" width="3" height="7" fill="#1d5a31"/>
  </g>

</svg>
