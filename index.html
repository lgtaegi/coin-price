<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alert Toggle Test</title>

<style>
body{
  background:#1f1f1f;
  color:#eee;
  font-family:system-ui;
  padding:40px;
}
.alert-panel{
  border:1px solid #444;
  border-radius:12px;
  padding:20px;
  width:260px;
}
.alert-panel.on{
  border-color:#0f6d3a;
  box-shadow:0 0 0 2px rgba(15,109,58,.2) inset;
}
button{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid #444;
  background:#2a2a2a;
  color:#ccc;
  cursor:pointer;
}
button.on{
  background:rgba(255,209,102,.25);
  border-color:#ffd166;
  color:#fff;
}
</style>
</head>

<body>

<div id="panel" class="alert-panel">
  <button id="btn">Alerts OFF</button>
</div>

<script>
let enabled = false;

const btn = document.getElementById("btn");
const panel = document.getElementById("panel");

btn.onclick = () => {
  enabled = !enabled;
  render();
};

function render(){
  btn.classList.toggle("on", enabled);
  panel.classList.toggle("on", enabled);
  btn.textContent = enabled ? "Alerts ON" : "Alerts OFF";
}

render();
</script>

</body>
</html>
