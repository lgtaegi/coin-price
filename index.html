<!--
Version: 1.23
Date: 2026-02-07
Updated:
- Alert buttons now have clear visual states
- Alert panel shows ON/OFF state at a glance
- Enable / Blocked / Off are text + color differentiated
- Arm button gives click feedback only (no persistent state)
Author: lgtaegi
-->

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTC Dashboard</title>

<style>
:root{
  --bg:#1f1f1f;
  --card:#252525;
  --border:#3a3a3a;
  --text:#e9e9e9;
  --muted:#b3b3b3;
  --muted2:#9a9a9a;
  --green:#0f6d3a;
  --stale:#7a8a4a;
  --error:#ff6b6b;
  --bright:#f3f3f3;
  --alert:#ffd166;
}

/* ---------- BASE ---------- */
body{
  margin:0;
  padding:24px;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
.card{
  max-width:560px;
  margin:0 auto;
  padding:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
  position:relative;
}
h1{ margin:0; font-size:20px; }

/* ---------- ALERT BUTTON STATES ---------- */
.a-btn{
  padding:5px 8px;
  border-radius:9px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  color:var(--muted);
  cursor:pointer;
  font-size:11px;
}
.a-btn:hover{ background:rgba(255,255,255,0.06); }
.a-btn:disabled{ opacity:.55; cursor:not-allowed; }

.a-btn.is-on{
  background: rgba(255,209,102,0.20);
  border-color: rgba(255,209,102,0.70);
  color: var(--bright);
}
.a-btn.is-off{
  background: rgba(255,107,107,0.18);
  border-color: rgba(255,107,107,0.70);
  color: var(--bright);
}
.a-btn.is-warn{
  background: rgba(255,107,107,0.22);
  border-color: rgba(255,107,107,0.85);
  color: var(--bright);
}

/* ---------- ALERT PANEL ON INDICATOR ---------- */
.alert-panel{
  margin-top:8px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  background:rgba(255,255,255,0.02);
}
.alert-panel.armed{
  border-color: rgba(15,109,58,.75);
  box-shadow: 0 0 0 2px rgba(15,109,58,.12) inset;
}
.alert-title{
  font-size:12px;
  color:var(--muted2);
  display:flex;
  gap:8px;
  align-items:center;
}
.alert-title .dot{
  width:8px;height:8px;border-radius:50%;
  background:rgba(255,209,102,.45);
}
.alert-panel.armed .alert-title .dot{
  background: rgba(15,109,58,.8);
}

/* ---------- ARM FEEDBACK ---------- */
@keyframes armFlash{
  0%{transform:scale(1)}
  50%{transform:scale(1.05)}
  100%{transform:scale(1)}
}
.a-btn.pulse{ animation:armFlash .35s ease-in-out; }

/* ---------- LAYOUT ---------- */
.alert-actions{ display:flex; gap:6px; }
.a-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:8px; font-size:12px; }
.a-row input, .a-row select{
  background:rgba(0,0,0,.2);
  border:1px solid var(--border);
  border-radius:8px;
  color:var(--text);
  padding:4px 6px;
}

/* ---------- TOAST ---------- */
.toast{
  position:absolute;
  inset:14px;
  padding:10px;
  border-radius:12px;
  border:1px solid rgba(255,209,102,.4);
  background:rgba(20,20,20,.95);
  display:none;
  justify-content:space-between;
}
.toast.show{ display:flex; }
.toast button{
  background:none;border:1px solid var(--border);
  color:var(--muted);border-radius:8px;
}
</style>
</head>

<body>
<div class="card">

<h1>Bitcoin Dashboard</h1>

<div class="alert-panel" id="alertPanel">
  <div class="alert-title">
    <span class="dot"></span>
    Price Alerts
  </div>

  <div class="alert-actions">
    <button id="notifBtn" class="a-btn">Enable</button>
    <button id="armBtn" class="a-btn">Arm</button>
    <button id="disarmBtn" class="a-btn">Off</button>
  </div>

  <div class="a-row">
    <label><input id="alertsEnabled" type="checkbox"> Alerts On</label>
  </div>
</div>

<div id="toast" class="toast">
  <span id="toastMsg"></span>
  <button onclick="toast.classList.remove('show')">✕</button>
</div>

</div>

<script>
const notifBtn = document.getElementById("notifBtn");
const armBtn = document.getElementById("armBtn");
const disarmBtn = document.getElementById("disarmBtn");
const alertsEnabled = document.getElementById("alertsEnabled");
const alertPanel = document.getElementById("alertPanel");
const toast = document.getElementById("toast");
const toastMsg = document.getElementById("toastMsg");

let alerts = { enabled:false };

function showToast(msg){
  toastMsg.textContent = msg;
  toast.classList.add("show");
  setTimeout(()=>toast.classList.remove("show"),4000);
}

function refreshAlertButtonsUI(){
  [notifBtn, armBtn, disarmBtn].forEach(b=>{
    b.className = "a-btn";
    b.disabled = false;
  });

  alertPanel.classList.toggle("armed", alerts.enabled);

  if("Notification" in window){
    if(Notification.permission === "granted"){
      notifBtn.textContent = "Enabled ✓";
      notifBtn.classList.add("is-on");
    }else if(Notification.permission === "denied"){
      notifBtn.textContent = "Blocked ✕";
      notifBtn.classList.add("is-warn");
    }else{
      notifBtn.textContent = "Enable";
    }
  }else{
    notifBtn.textContent = "No Notify";
    notifBtn.disabled = true;
  }

  if(!alerts.enabled){
    disarmBtn.textContent = "Off ●";
    disarmBtn.classList.add("is-off");
  }else{
    disarmBtn.textContent = "Off";
  }
}

notifBtn.onclick = async ()=>{
  const p = await Notification.requestPermission();
  refreshAlertButtonsUI();
  showToast(p==="granted"?"Notifications enabled":"Notifications blocked");
};

armBtn.onclick = ()=>{
  armBtn.classList.add("pulse");
  setTimeout(()=>armBtn.classList.remove("pulse"),350);
  showToast("Base price armed");
};

disarmBtn.onclick = ()=>{
  alerts.enabled = false;
  alertsEnabled.checked = false;
  refreshAlertButtonsUI();
  showToast("Alerts off");
};

alertsEnabled.onchange = ()=>{
  alerts.enabled = alertsEnabled.checked;
  refreshAlertButtonsUI();
};

refreshAlertButtonsUI();
</script>
</body>
</html>
