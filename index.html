<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTC Dashboard</title>

<style>
:root{
  --bg:#1f1f1f;
  --card:#252525;
  --border:#3a3a3a;
  --text:#e9e9e9;
  --muted:#b3b3b3;
  --green:#0f6d3a;
  --warn:#ff6b6b;
  --on:#ffd166;
}

body{
  margin:0;
  padding:24px;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

.card{
  max-width:560px;
  margin:auto;
  padding:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
}

h1{ margin:0 0 12px; font-size:20px; }

.alert-panel{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  background:rgba(255,255,255,0.02);
}
.alert-panel.armed{
  border-color:var(--green);
  box-shadow:0 0 0 2px rgba(15,109,58,.2) inset;
}

.alert-title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:13px;
  color:var(--muted);
  margin-bottom:10px;
}
.alert-title .dot{
  width:8px;height:8px;border-radius:50%;
  background:#666;
}
.alert-panel.armed .dot{ background:var(--green); }

.alert-actions{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}

.a-btn{
  font-size:11px;
  padding:6px 10px;
  border-radius:9px;
  border:1px solid var(--border);
  background:#2a2a2a;
  color:var(--muted);
  cursor:pointer;
}
.a-btn:hover{ background:#333; }
.a-btn:disabled{ opacity:.5; cursor:not-allowed; }

.a-btn.on{
  background:rgba(255,209,102,.25);
  border-color:var(--on);
  color:#fff;
}
.a-btn.off{
  background:rgba(255,107,107,.25);
  border-color:var(--warn);
  color:#fff;
}
.a-btn.warn{
  background:rgba(255,107,107,.35);
  border-color:var(--warn);
  color:#fff;
}

@keyframes pulse{
  0%{transform:scale(1)}
  50%{transform:scale(1.05)}
  100%{transform:scale(1)}
}
.a-btn.pulse{ animation:pulse .35s ease; }

.a-row{
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>
<div class="card">

<h1>Bitcoin Dashboard</h1>

<div id="alertPanel" class="alert-panel">
  <div class="alert-title">
    <span class="dot"></span>
    Price Alerts
  </div>

  <div class="alert-actions">
    <button id="notifBtn" class="a-btn">Enable</button>
    <button id="armBtn" class="a-btn">Arm</button>
    <button id="offBtn" class="a-btn">Off</button>
  </div>

  <div class="a-row">
    <label>
      <input type="checkbox" id="alertsEnabled">
      Alerts On
    </label>
  </div>
</div>

</div>

<script>
const notifBtn = document.getElementById("notifBtn");
const armBtn = document.getElementById("armBtn");
const offBtn = document.getElementById("offBtn");
const alertsEnabled = document.getElementById("alertsEnabled");
const alertPanel = document.getElementById("alertPanel");

const alerts = {
  enabled:false
};

/* ---------- UI ---------- */
function refreshAlertButtonsUI(){
  // reset
  [notifBtn, armBtn, offBtn].forEach(b=>{
    b.className = "a-btn";
    b.disabled = false;
  });

  // panel ON/OFF
  alertPanel.classList.toggle("armed", alerts.enabled);

  // notification button
  if(!("Notification" in window)){
    notifBtn.textContent = "No Notify";
    notifBtn.disabled = true;
  }else{
    if(Notification.permission === "granted"){
      notifBtn.textContent = "Enabled ✓";
      notifBtn.classList.add("on");
    }else if(Notification.permission === "denied"){
      notifBtn.textContent = "Blocked ✕";
      notifBtn.classList.add("warn");
    }else{
      notifBtn.textContent = "Enable";
    }
  }

  // off button
  if(!alerts.enabled){
    offBtn.textContent = "Off ●";
    offBtn.classList.add("off");
  }else{
    offBtn.textContent = "Off";
  }
}

/* ---------- EVENTS ---------- */
notifBtn.addEventListener("click", async ()=>{
  if(!("Notification" in window)) return;
  await Notification.requestPermission();
  refreshAlertButtonsUI();
});

alertsEnabled.addEventListener("change", ()=>{
  alerts.enabled = alertsEnabled.checked;
  refreshAlertButtonsUI();
});

offBtn.addEventListener("click", ()=>{
  alerts.enabled = false;
  alertsEnabled.checked = false;
  refreshAlertButtonsUI();
});

armBtn.addEventListener("click", ()=>{
  armBtn.classList.add("pulse");
  setTimeout(()=>armBtn.classList.remove("pulse"),350);
});

/* ---------- START ---------- */
refreshAlertButtonsUI();
</script>
</body>
</html>
