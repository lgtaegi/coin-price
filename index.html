<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BTC Live Price</title>

  <style>
    :root{
      --bg: #1f1f1f;          /* dark gray background */
      --card: #252525;        /* slightly lighter card */
      --border: #3a3a3a;
      --text: #e9e9e9;
      --muted: #b3b3b3;       /* comfortable, not flashy */
      --muted2: #9a9a9a;
      --green: #0f6d3a;       /* darker green for price */
      --error: #ff6b6b;
    }

    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
    }

    .card {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 20px;
      color: var(--text);
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .pill {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
      background: rgba(255,255,255,0.02);
    }

    button {
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      cursor: pointer;
    }

    button:hover {
      background: rgba(255,255,255,0.06);
    }

    button:active {
      transform: translateY(1px);
    }

    .price {
      font-size: 44px;
      font-weight: 800;
      margin: 14px 0 10px;
      color: var(--green); /* darker green */
      letter-spacing: 0.2px;
    }

    .muted {
      color: var(--muted2);
      font-size: 13px;
    }

    .err {
      color: var(--error);
      font-size: 13px;
      margin-top: 10px;
      white-space: pre-wrap;
    }

    .times {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: baseline;
      font-size: 14px;
      color: var(--muted); /* time color: soft, not flashy */
    }

    .time-row .label {
      color: var(--muted2);
    }

    .time-row .val {
      font-variant-numeric: tabular-nums;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Bitcoin Price (BTC-USD)</h1>

    <div class="row">
      <div id="status" class="pill">● Connecting…</div>
      <div id="updated" class="pill">Last updated: -</div>
      <button id="refresh">Refresh now</button>
    </div>

    <div id="price" class="price">-</div>

    <div class="muted">
      Auto refresh every 5 seconds (Free / No server)
    </div>

    <div class="times" aria-label="World clocks">
      <div class="time-row">
        <div class="label">Local time</div>
        <div id="tLocal" class="val">-</div>
      </div>
      <div class="time-row">
        <div class="label">US Eastern (New York)</div>
        <div id="tET" class="val">-</div>
      </div>
      <div class="time-row">
        <div class="label">US Pacific (Los Angeles)</div>
        <div id="tPT" class="val">-</div>
      </div>
      <div class="time-row">
        <div class="label">Korea (Seoul)</div>
        <div id="tKR" class="val">-</div>
      </div>
    </div>

    <div id="error" class="err"></div>
  </div>

  <script>
    // Free Coinbase public API (no key required, CORS-friendly)
    const URL = "https://api.coinbase.com/v2/prices/spot?currency=USD";
    const INTERVAL_MS = 5000;

    const elPrice = document.getElementById("price");
    const elStatus = document.getElementById("status");
    const elUpdated = document.getElementById("updated");
    const elError = document.getElementById("error");
    const btnRefresh = document.getElementById("refresh");

    const elLocal = document.getElementById("tLocal");
    const elET = document.getElementById("tET");
    const elPT = document.getElementById("tPT");
    const elKR = document.getElementById("tKR");

    let timer = null;

    function fmtUSD(n) {
      return new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD"
      }).format(n);
    }

    function fmtTime(tz) {
      // Comfortable, readable, no loud styling: just a clean time + date
      const opt = {
        timeZone: tz,
        weekday: "short",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      };
      return new Intl.DateTimeFormat("en-US", opt).format(new Date());
    }

    function updateClocks() {
      // Local time (device timezone)
      const localOpt = {
        weekday: "short",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      };
      elLocal.textContent = new Intl.DateTimeFormat("en-US", localOpt).format(new Date());

      // US Eastern / US Pacific / Korea
      elET.textContent = fmtTime("America/New_York");
      elPT.textContent = fmtTime("America/Los_Angeles");
      elKR.textContent = fmtTime("Asia/Seoul");
    }

    async function fetchPrice() {
      elError.textContent = "";
      elStatus.textContent = "● Updating…";

      try {
        const res = await fetch(URL, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);

        const json = await res.json();
        const amount = Number(json?.data?.amount);
        if (!Number.isFinite(amount)) {
          throw new Error("Unexpected response format");
        }

        elPrice.textContent = fmtUSD(amount);
        elUpdated.textContent = "Last updated: " + new Date().toLocaleTimeString("en-US");
        elStatus.textContent = "● LIVE";
      } catch (err) {
        elStatus.textContent = "○ Retrying";
        elError.textContent = "Error: " + err.message;
      }
    }

    function start() {
      updateClocks();           // run immediately
      fetchPrice();             // run immediately
      timer = setInterval(() => {
        updateClocks();
        fetchPrice();
      }, INTERVAL_MS);

      // Make clocks feel real-time even between price refreshes
      setInterval(updateClocks, 1000);
    }

    btnRefresh.addEventListener("click", () => {
      updateClocks();
      fetchPrice();
    });

    start();
  </script>
</body>
</html>
