- Button highlight logic refined:
  - Enable highlights only when browser Notification permission is granted
  - Off highlights only when Alerts are OFF
  - Arm stays neutral (no persistent highlight)

<!-- ✅ Drop-in PATCH: replace ONLY these parts in your existing 1.22 file:
  1) CSS: replace the .a-btn styles + add .a-btn--small
  2) JS: replace refreshAlertButtonsUI() + small part of syncAlertsUI() for Enable label
  (Everything else stays the same.)
-->

<style>
/* ====== REPLACE your existing .a-btn / state styles with these ====== */

.a-btn{
  padding:5px 8px;              /* smaller */
  border-radius:9px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  color:var(--muted);
  cursor:pointer;
  font-size:11px;               /* smaller */
  line-height:1;
  white-space:nowrap;
}
.a-btn:hover{ background:rgba(255,255,255,0.06); }
.a-btn:active{ transform:translateY(1px); }

/* “selected” (bright) states – used ONLY for Enable(granted) and Off(alerts off) */
.a-btn.is-on{
  background: rgba(255, 209, 102, 0.18);
  border-color: rgba(255, 209, 102, 0.60);
  color: var(--bright);
  box-shadow: 0 0 0 2px rgba(255, 209, 102, 0.10) inset;
}
.a-btn.is-off{
  background: rgba(255, 107, 107, 0.12);
  border-color: rgba(255, 107, 107, 0.55);
  color: var(--bright);
  box-shadow: 0 0 0 2px rgba(255, 107, 107, 0.08) inset;
}

/* neutral = default */
.a-btn.is-neutral{
  background: rgba(255,255,255,0.03);
  border-color: var(--border);
  color: var(--muted);
  box-shadow:none;
}

/* optional: slightly tighter container spacing */
.alert-actions{ display:flex; gap:6px; align-items:center; }
</style>

<script>
/* ====== REPLACE refreshAlertButtonsUI() with this version ====== */
function refreshAlertButtonsUI(){
  // reset classes
  [notifBtn, armBtn, disarmBtn].forEach(b=>{
    b.classList.remove("is-on","is-off","is-neutral");
    b.classList.add("is-neutral");
  });

  // Enable button: bright ONLY if Notification permission is granted
  if(!("Notification" in window)){
    notifBtn.textContent = "No Notify";
    notifBtn.disabled = true;
    // keep neutral
  } else {
    notifBtn.disabled = false;
    const p = Notification.permission;
    // label
    notifBtn.textContent = (p === "granted") ? "Enabled" : (p === "denied" ? "Blocked" : "Enable");
    // highlight rule
    if(p === "granted") notifBtn.classList.add("is-on");
  }

  // Arm button: ALWAYS neutral (no persistent highlight)
  armBtn.classList.add("is-neutral");

  // Off button: bright ONLY when alerts are OFF
  if(!alerts.enabled){
    disarmBtn.classList.add("is-off");
  } else {
    disarmBtn.classList.add("is-neutral");
  }
}

/* ====== OPTIONAL: remove any old Enable-label logic inside syncAlertsUI()
   If your syncAlertsUI() sets notifBtn.textContent, you can delete that part
   and just call refreshAlertButtonsUI() at the end. Example below.
====== */
function syncAlertsUI(){
  alertsEnabled.checked = !!alerts.enabled;
  cooldownMin.value = String(alerts.cooldownMin ?? 5);

  crossEnabled.checked = !!alerts.crossEnabled;
  crossTarget.value = (Number.isFinite(alerts.crossTarget) ? String(Math.round(alerts.crossTarget)) : "");
  crossMode.value = alerts.crossMode || "above";
  crossOneShot.checked = !!alerts.crossOneShot;

  deltaEnabled.checked = !!alerts.deltaEnabled;
  upUsd.value = (Number.isFinite(alerts.upUsd) ? String(Math.round(alerts.upUsd)) : "");
  downUsd.value = (Number.isFinite(alerts.downUsd) ? String(Math.round(alerts.downUsd)) : "");
  upPct.value = (Number.isFinite(alerts.upPct) ? String(alerts.upPct) : "");
  downPct.value = (Number.isFinite(alerts.downPct) ? String(alerts.downPct) : "");

  updateBaseLabel();

  // ✅ Let refreshAlertButtonsUI decide label + colors
  refreshAlertButtonsUI();
}
</script>
