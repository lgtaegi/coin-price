<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTC Dashboard</title>

<style>
:root{
  --bg:#1f1f1f;
  --card:#252525;
  --border:#3a3a3a;
  --text:#e9e9e9;
  --muted:#b3b3b3;
  --muted2:#9a9a9a;
  --green:#0f6d3a;
  --stale:#7a8a4a;
  --error:#ff6b6b;
  --bright:#f3f3f3;
  --alert:#ffd166;
  --warn:#ff6b6b;
}

body{
  margin:0;
  padding:24px;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

.card{
  max-width:560px;
  margin:0 auto;
  padding:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
}

/* ---------- HEADER ---------- */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin-bottom:10px;
}
h1{ margin:0; font-size:20px; }

/* ---------- PRICE ---------- */
.primary{
  font-size:44px;
  font-weight:800;
  margin:14px 0 2px;
  color:var(--green);
  white-space:nowrap;
}
.primary.is-stale{
  color:var(--stale);
  animation:stalePulse 1.4s ease-in-out infinite;
}
@keyframes stalePulse{0%,100%{opacity:1}50%{opacity:.55}}

.secondary{
  font-size:13px;
  color:var(--muted2);
}

/* ---------- ALERT PANEL ---------- */
.alert-panel{
  margin-top:14px;
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  background:rgba(255,255,255,0.02);
}
.alert-panel.armed{
  border-color:var(--green);
  box-shadow:0 0 0 2px rgba(15,109,58,.18) inset;
}

.alert-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.alert-title{
  font-size:12px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:8px;
}
.alert-title .dot{
  width:8px;height:8px;border-radius:50%;
  background:#666;
}
.alert-panel.armed .dot{ background:var(--green); }

.alert-btn{
  padding:6px 12px;
  font-size:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#2a2a2a;
  color:var(--muted);
  cursor:pointer;
}
.alert-btn:hover{ background:#333; }

.alert-btn.on{
  background:rgba(255,209,102,.22);
  border-color:var(--alert);
  color:#fff;
}
.alert-btn.warn{
  background:rgba(255,107,107,.25);
  border-color:var(--warn);
  color:#fff;
}

.a-row{
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
}

/* ---------- TIMES ---------- */
.times{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--border);
  display:grid;
  gap:8px;
}
.time-row{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  color:var(--muted);
}

.err{ color:var(--error); font-size:13px; margin-top:10px; }
</style>
</head>

<body>
<div class="card">

  <div class="header">
    <h1>Bitcoin Dashboard</h1>
  </div>

  <div id="primaryDisplay" class="primary">-</div>
  <div id="secondaryDisplay" class="secondary">-</div>

  <div class="times">
    <div class="time-row"><span>Salt Lake City</span><span id="tMT">-</span></div>
    <div class="time-row"><span>New York</span><span id="tNY">-</span></div>
    <div class="time-row"><span>Seoul</span><span id="tKR">-</span></div>
  </div>

  <div id="alertPanel" class="alert-panel">
    <div class="alert-head">
      <div class="alert-title">
        <span class="dot"></span>
        Price Alerts
      </div>
      <button id="alertsBtn" class="alert-btn">Enable Alerts</button>
    </div>

    <div class="a-row">
      Alerts are based on the price when turned ON.
    </div>
  </div>

  <div id="error" class="err"></div>

</div>

<script>
/* ---------- CONFIG ---------- */
const PRICE_URL="https://api.coinbase.com/v2/prices/spot?currency=USD";

/* ---------- STATE ---------- */
let latestAmountNum = NaN;
let lastGoodPriceUpdate = 0;

const alerts = {
  enabled:false,
  basePrice:null
};

const alertsBtn = document.getElementById("alertsBtn");
const alertPanel = document.getElementById("alertPanel");

/* ---------- HELPERS ---------- */
const fmtUSD0 = n =>
  Number.isFinite(n)
    ? new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n)
    : "-";

const fmtTime = tz =>
  new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true}).format(new Date());

/* ---------- UI ---------- */
function refreshAlertsUI(){
  alertsBtn.className="alert-btn";
  alertPanel.classList.toggle("armed",alerts.enabled);

  if(!("Notification" in window)){
    alertsBtn.textContent="No Notifications";
    alertsBtn.disabled=true;
    return;
  }

  if(Notification.permission==="denied"){
    alertsBtn.textContent="Blocked ✕";
    alertsBtn.classList.add("warn");
    alerts.enabled=false;
    return;
  }

  if(alerts.enabled){
    alertsBtn.textContent="Alerts ON";
    alertsBtn.classList.add("on");
  }else{
    alertsBtn.textContent="Alerts OFF";
  }
}

/* ---------- EVENTS ---------- */
alertsBtn.addEventListener("click",async()=>{
  if(!("Notification" in window)) return;

  if(Notification.permission==="default"){
    await Notification.requestPermission();
  }

  if(Notification.permission==="granted"){
    alerts.enabled=!alerts.enabled;
    if(alerts.enabled && Number.isFinite(latestAmountNum)){
      alerts.basePrice=latestAmountNum;
      console.log("Base price set:",alerts.basePrice);
    }
  }else{
    alerts.enabled=false;
  }

  refreshAlertsUI();
});

/* ---------- PRICE ---------- */
async function fetchPrice(){
  try{
    const r=await fetch(PRICE_URL,{cache:"no-store"});
    const j=await r.json();
    latestAmountNum=Number(j?.data?.amount);
    primaryDisplay.textContent=fmtUSD0(latestAmountNum);
    lastGoodPriceUpdate=Date.now();
    error.textContent="";
  }catch(e){
    error.textContent="Price error";
  }
}

/* ---------- TIME ---------- */
function updateTime(){
  tMT.textContent=fmtTime("America/Denver");
  tNY.textContent=fmtTime("America/New_York");
  tKR.textContent=fmtTime("Asia/Seoul");
}

/* ---------- START ---------- */
refreshAlertsUI();
fetchPrice();
updateTime();
setInterval(fetchPrice,5000);
setInterval(updateTime,1000);
</script>

</body>
</html>
