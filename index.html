<!--
Version: 1.16
Date: 2026-02-01
Updated:
- Removed top empty space; placed swap (price/time) button inline to the right of "Bitcoin Dashboard"
- Removed "Today (MT)" label; show only the Mountain Time date/time value
- Weather marquee weekday switched to 3-letter format (Mon/Tue/Wed/Thu/Fri/Sat/Sun)
- Added brighter marquee filler message before/around weather loads: "오늘도 행복하자 / Let’s be happy today."
- Removed status indicator ("● Connecting…", "● LIVE", etc.) entirely
- Replaced Refresh button with circular arrow refresh icon; aligned to the far-right of the "Updated:" row
- Removed always-on secondary time under price; improved swap mode typography:
  - When primary is TIME: primary font slightly smaller to fit one line
  - Secondary "BTC: $xx,xxx" font increased ~1.5x
- Timezone list updated: "US Eastern" -> "New York", removed "US Pacific", "Korea (Seoul)" -> "Seoul"
- Kept all existing features (weather, timezones, stale detection, chart with TF + hide/show persistence)
Author: lgtaegi
-->

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTC Dashboard</title>

<style>
:root{
  --bg:#1f1f1f;
  --card:#252525;
  --border:#3a3a3a;
  --text:#e9e9e9;
  --muted:#b3b3b3;
  --muted2:#9a9a9a;
  --green:#0f6d3a;
  --stale:#7a8a4a;
  --error:#ff6b6b;
  --bright:#eaeaea; /* brighter for 행복하자 line */
}

body{
  margin:0;
  padding:24px;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

.card{
  max-width:560px;
  margin:0 auto;
  padding:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
}

.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 0 10px; /* no top gap */
}

h1{
  margin:0; /* remove extra space above */
  font-size:20px;
}

.swap-btn{
  font-size:12px;
  padding:4px 8px;
  border-radius:8px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  color:var(--muted);
  cursor:pointer;
}
.swap-btn:hover{ background:rgba(255,255,255,0.08); }

.primary{
  font-size:44px;
  font-weight:800;
  margin:14px 0 2px;
  color:var(--green);
  letter-spacing:0.2px;
  white-space:nowrap;
}

.primary.is-stale{
  color:var(--stale);
  animation:stalePulse 1.4s ease-in-out infinite;
}

@keyframes stalePulse{
  0%,100%{opacity:1}
  50%{opacity:.55}
}

.secondary{
  font-size:13px;
  color:var(--muted2);
}

/* bigger secondary when showing BTC under time */
.secondary.big{
  font-size:19.5px; /* ~1.5x */
  color:var(--muted);
}

.tinybar{
  font-size:12px;
  color:var(--muted2);
  margin-bottom:6px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:baseline;
}

.stale-age{
  font-size:11px;
  color:var(--muted);
  display:none;
}

/* weather marquee */
.weather-marquee{
  overflow:hidden;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:6px 0;
  margin-bottom:10px;
}

.weather-track{
  display:inline-flex;
  gap:28px;
  white-space:nowrap;
  animation:scroll-left 84s linear infinite; /* 1/3 speed */
  font-size:11px;
  color:var(--muted);
}

.weather-item{
  display:inline-flex;
  align-items:center;
  gap:6px;
}

.filler{
  color:var(--bright);
  opacity:0.95;
}

@keyframes scroll-left{
  from{transform:translateX(100%);}
  to{transform:translateX(-100%);}
}

@media (prefers-reduced-motion: reduce){
  .weather-track{animation:none;}
  .primary.is-stale{animation:none;}
}

.row{
  display:flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
}

.pill{
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  font-size:13px;
  color:var(--muted);
}

.updated-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  width:100%;
}

.refresh-icon-btn{
  width:34px;
  height:34px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  color:var(--muted);
  cursor:pointer;
  padding:0;
}
.refresh-icon-btn:hover{ background:rgba(255,255,255,0.08); }
.refresh-icon-btn:active{ transform:translateY(1px); }

.refresh-icon{
  width:16px;
  height:16px;
  display:block;
}

.times{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--border);
  display:grid;
  gap:8px;
}

.time-row{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  color:var(--muted);
}

.err{
  color:var(--error);
  font-size:13px;
  margin-top:10px;
  white-space:pre-wrap;
}

/* ---------- chart add-on (B option) ---------- */
.main-grid{
  display:flex;
  gap:14px;
  align-items:flex-start;
  flex-wrap:wrap;
}

.left-pane{
  flex:1 1 260px;
  min-width:240px;
}

.right-pane{
  flex:0 0 230px;
  width:230px;
}

.chart-card{
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  background:rgba(255,255,255,0.02);
}

.chart-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.chart-title{
  font-size:12px;
  color:var(--muted2);
}

.tf{
  display:flex;
  gap:6px;
}

.tf button{
  padding:5px 8px;
  border-radius:8px;
  font-size:11px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  color:var(--muted);
  cursor:pointer;
}

.tf button:hover{ background:rgba(255,255,255,0.06); }

.tf button.active{
  background:rgba(255,255,255,0.10);
  color:var(--text);
}

#tvChart{
  height:170px;
  border-radius:10px;
  overflow:hidden;
}

.chart-toggle{
  width:100%;
  margin-top:8px;
  padding:8px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  color:var(--muted);
  cursor:pointer;
}
.chart-toggle:hover{ background:rgba(255,255,255,0.06); }

/* hidden state */
.right-pane.is-hidden #tvChart,
.right-pane.is-hidden .tf{
  display:none;
}
.right-pane.is-hidden .chart-title{
  opacity:0.9;
}
</style>
</head>

<body>
<div class="card">

  <!-- 1) Title + swap button inline -->
  <div class="header">
    <h1>Bitcoin Dashboard</h1>
    <button id="swapBtn" class="swap-btn" title="Swap price / time">⇄</button>
  </div>

  <!-- 2) Remove 'Today (MT)' text: show value only -->
  <div class="tinybar">
    <span id="todayMT">-</span>
    <span id="staleAge" class="stale-age">Last update: -</span>
  </div>

  <!-- 3) Weather marquee with filler -->
  <div class="weather-marquee">
    <div id="weatherTrack" class="weather-track">
      <span class="weather-item filler">오늘도 행복하자 / Let’s be happy today.</span>
      <span class="weather-item filler">오늘도 행복하자 / Let’s be happy today.</span>
      <span class="weather-item filler">오늘도 행복하자 / Let’s be happy today.</span>
    </div>
  </div>

  <div class="main-grid">
    <div class="left-pane">
      <!-- 4) Remove Connecting/LIVE pill entirely (no status row).
              5) Updated + refresh icon aligned right -->
      <div class="updated-row">
        <div id="updated" class="pill">Updated: -</div>

        <button id="refreshBtn" class="refresh-icon-btn" title="Refresh">
          <!-- circular arrow icon (inline SVG) -->
          <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M20 4v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div id="primaryDisplay" class="primary">-</div>
      <div id="secondaryDisplay" class="secondary">-</div>

      <!-- 7) Timezone list updated -->
      <div class="times">
        <div class="time-row"><span>Salt Lake City</span><span id="tMT">-</span></div>
        <div class="time-row"><span>New York</span><span id="tNY">-</span></div>
        <div class="time-row"><span>Seoul</span><span id="tKR">-</span></div>
      </div>

      <div id="error" class="err"></div>
    </div>

    <div id="rightPane" class="right-pane">
      <div class="chart-card">
        <div class="chart-head">
          <div class="chart-title">BTCUSD Mini Chart</div>
          <div class="tf" aria-label="Timeframes">
            <button class="tf-btn" data-interval="5">5m</button>
            <button class="tf-btn" data-interval="30">30m</button>
            <button class="tf-btn" data-interval="60">1h</button>
            <button class="tf-btn" data-interval="240">4h</button>
          </div>
        </div>

        <div id="tvChart"></div>

        <button id="toggleChartBtn" class="chart-toggle">Hide chart</button>
      </div>
    </div>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
/* ---------- CONFIG ---------- */
const PRICE_URL="https://api.coinbase.com/v2/prices/spot?currency=USD";
const WX_URL="https://api.open-meteo.com/v1/forecast?latitude=40.7608&longitude=-111.8910&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America/Denver";

const WARN_AFTER_MS = 45_000;
const STALE_AFTER_MS = 60_000;

const TF_KEY = "btcChartTF";
const CHART_HIDDEN_KEY = "btcChartHidden";

const FILLER_KO = "오늘도 행복하자";
const FILLER_EN = "Let’s be happy today.";

/* ---------- STATE ---------- */
let isPricePrimary = true;     // true => primary shows PRICE, false => primary shows TIME (MT)
let latestPrice = "-";
let lastGoodPriceUpdate = 0;

let currentInterval = localStorage.getItem(TF_KEY) || "60";
let chartHidden = (localStorage.getItem(CHART_HIDDEN_KEY) === "1");

/* ---------- HELPERS ---------- */
const fmtTime = (tz) => new Intl.DateTimeFormat("en-US", {
  timeZone: tz,
  hour: "2-digit",
  minute: "2-digit",
  second: "2-digit",
  hour12: true
}).format(new Date());

const fmtDateTimeNoLabel = (tz) => new Intl.DateTimeFormat("en-US", {
  timeZone: tz,
  weekday: "short",
  month: "2-digit",
  day: "2-digit",
  hour: "2-digit",
  minute: "2-digit",
  second: "2-digit",
  hour12: true
}).format(new Date());

function fmtAgo(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(s/60);
  const r = s % 60;
  return `${m}m ${String(r).padStart(2,"0")}s ago`;
}

/* 6) Typography rules for swap modes */
function applySwapTypography(){
  if(isPricePrimary){
    // Price is primary (big). Secondary hidden (no MT time under price).
    primaryDisplay.style.fontSize = "44px";
    secondaryDisplay.classList.remove("big");
    secondaryDisplay.style.display = "none";
  } else {
    // Time is primary: slightly smaller so it fits one line.
    primaryDisplay.style.fontSize = "36px";
    secondaryDisplay.classList.add("big");
    secondaryDisplay.style.display = "block";
  }
}

function renderDisplays(){
  if(isPricePrimary){
    primaryDisplay.textContent = latestPrice;
    secondaryDisplay.textContent = ""; // hidden
  } else {
    const mt = fmtTime("America/Denver");
    primaryDisplay.textContent = mt;
    secondaryDisplay.textContent = "BTC: " + latestPrice;
  }
}

/* ---------- WEATHER ---------- */
const wxIcon = (c) => {
  c = Number(c);
  if(c === 0) return "☀️";
  if(c <= 3) return "☁️";
  if(c <= 67) return "🌧️";
  if(c <= 86) return "❄️";
  if(c >= 95) return "⛈️";
  return "🌤️";
};

function dayShort3(dateStr){
  // dateStr "YYYY-MM-DD" -> Mon/Tue/...
  const d = new Date(dateStr + "T00:00:00");
  return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
}
function mdDate(dateStr){
  return dateStr.slice(5).replace("-", "/"); // MM/DD
}

/* Build marquee content: include filler to prevent "empty gaps" */
function buildMarquee(itemsHtml){
  const filler = `
    <span class="weather-item filler">${FILLER_KO} / ${FILLER_EN}</span>
    <span class="weather-item filler">${FILLER_KO} / ${FILLER_EN}</span>
  `;
  // Repeat sequence to keep continuous scroll
  weatherTrack.innerHTML = (itemsHtml + filler + itemsHtml + filler);
}

async function fetchWeather(){
  try{
    // While loading, ensure filler is present (keeps marquee non-empty)
    buildMarquee(`<span class="weather-item filler">${FILLER_KO} / ${FILLER_EN}</span>`);

    const r = await fetch(WX_URL, { cache: "no-store" });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    const days = d.daily.time.slice(0,7);

    const items = days.map((day,i)=>`
      <span class="weather-item">
        ${dayShort3(day)} (${mdDate(day)})
        ${wxIcon(d.daily.weather_code[i])}
        ${Math.round(d.daily.temperature_2m_max[i])}/${Math.round(d.daily.temperature_2m_min[i])}°
      </span>
    `).join("");

    buildMarquee(items);
  }catch(e){
    // If weather fails, keep filler only
    buildMarquee(`<span class="weather-item filler">${FILLER_KO} / ${FILLER_EN}</span>`);
  }
}

/* ---------- PRICE ---------- */
async function fetchPrice(){
  try{
    const r = await fetch(PRICE_URL, { cache: "no-store" });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();

    // cents removed
    latestPrice = new Intl.NumberFormat("en-US", {
      style: "currency",
      currency: "USD",
      maximumFractionDigits: 0
    }).format(j?.data?.amount);

    lastGoodPriceUpdate = Date.now();

    updated.textContent = "Updated: " + fmtTime("America/Denver") + " (MT)";
    error.textContent = "";

    renderDisplays();
    updateStaleUI();
  }catch(e){
    error.textContent = "Error: " + (e?.message || String(e));
  }
}

/* ---------- TIMEZONES ---------- */
function updateTime(){
  todayMT.textContent = fmtDateTimeNoLabel("America/Denver");
  tMT.textContent = fmtTime("America/Denver");
  tNY.textContent = fmtTime("America/New_York");
  tKR.textContent = fmtTime("Asia/Seoul");

  renderDisplays();
}

/* ---------- STALE UI ---------- */
function updateStaleUI(){
  const now = Date.now();
  const base = lastGoodPriceUpdate || now;
  const elapsed = now - base;

  if(elapsed >= WARN_AFTER_MS){
    staleAge.style.display = "inline";
    staleAge.textContent = "Last update: " + fmtAgo(elapsed);
  } else {
    staleAge.style.display = "none";
  }

  if(elapsed >= STALE_AFTER_MS){
    primaryDisplay.classList.add("is-stale");
  } else {
    primaryDisplay.classList.remove("is-stale");
  }
}

/* ---------- CHART (TradingView embed) ---------- */
function setActiveTf(interval){
  document.querySelectorAll(".tf-btn").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.interval === String(interval));
  });
}

function buildTVChart(interval){
  currentInterval = String(interval);
  localStorage.setItem(TF_KEY, currentInterval);
  setActiveTf(currentInterval);

  if(chartHidden) return;

  const el = document.getElementById("tvChart");
  el.innerHTML = "";

  const innerId = "tv_inner_" + Date.now();
  const inner = document.createElement("div");
  inner.id = innerId;
  inner.style.height = "170px";
  el.appendChild(inner);

  new TradingView.widget({
    autosize: true,
    symbol: "COINBASE:BTCUSD",
    interval: currentInterval,
    timezone: "America/Denver",
    theme: "dark",
    style: "1",
    locale: "en",
    enable_publishing: false,
    hide_legend: true,
    hide_side_toolbar: true,
    allow_symbol_change: false,
    container_id: innerId,
    save_image: false,
    studies: [],
    withdateranges: false,
    details: false,
    calendar: false
  });
}

function setChartHidden(next){
  chartHidden = next;
  localStorage.setItem(CHART_HIDDEN_KEY, chartHidden ? "1" : "0");

  rightPane.classList.toggle("is-hidden", chartHidden);
  toggleChartBtn.textContent = chartHidden ? "Show chart" : "Hide chart";

  if(!chartHidden){
    if (window.TradingView && TradingView.widget) buildTVChart(currentInterval);
  } else {
    tvChart.innerHTML = "";
  }
}

document.querySelectorAll(".tf-btn").forEach(btn=>{
  btn.addEventListener("click", () => buildTVChart(btn.dataset.interval));
});

toggleChartBtn.addEventListener("click", ()=>{
  setChartHidden(!chartHidden);
});

/* ---------- EVENTS ---------- */
swapBtn.addEventListener("click", ()=>{
  isPricePrimary = !isPricePrimary;
  applySwapTypography();
  renderDisplays();
  updateStaleUI();
});

refreshBtn.addEventListener("click", ()=>{
  fetchPrice();
  fetchWeather();
});

/* ---------- START ---------- */
function start(){
  // initial typography & render state
  applySwapTypography();
  renderDisplays();

  updateTime();
  fetchPrice();
  fetchWeather();

  setChartHidden(chartHidden);
  setActiveTf(currentInterval);

  const bootChart = () => {
    if(!chartHidden) buildTVChart(currentInterval);
  };

  if (window.TradingView && TradingView.widget) {
    bootChart();
  } else {
    const t = setInterval(() => {
      if (window.TradingView && TradingView.widget) {
        clearInterval(t);
        bootChart();
      }
    }, 150);
  }

  setInterval(updateTime, 1000);
  setInterval(fetchPrice, 5000);
  setInterval(fetchWeather, 10 * 60 * 1000);
  setInterval(updateStaleUI, 1000);
}

start();
</script>
</body>
</html>
