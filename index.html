<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTC Dashboard</title>

<style>
:root{
  --bg:#1f1f1f;
  --card:#252525;
  --border:#3a3a3a;
  --text:#e9e9e9;
  --muted:#b3b3b3;
  --muted2:#9a9a9a;
  --green:#0f6d3a;
}

body{
  margin:0;
  padding:24px;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

.card{
  max-width:560px;
  margin:0 auto;
  padding:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
}

.topbar{
  display:flex;
  justify-content:flex-end;
}

.swap-btn{
  font-size:12px;
  padding:4px 8px;
  border-radius:8px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  color:var(--muted);
  cursor:pointer;
}

h1{ margin:6px 0 10px; font-size:20px; }

.primary{
  font-size:44px;
  font-weight:800;
  margin:14px 0 2px;
  color:var(--green);
}

.secondary{
  font-size:13px;
  color:var(--muted2);
}

.weather-marquee{
  overflow:hidden;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:6px 0;
  margin-bottom:10px;
}

.weather-track{
  display:inline-flex;
  gap:28px;
  white-space:nowrap;
  animation:scroll-left 84s linear infinite;
  font-size:11px;
  color:var(--muted);
}

@keyframes scroll-left{
  from{transform:translateX(100%);}
  to{transform:translateX(-100%);}
}

.main-grid{
  display:flex;
  gap:14px;
  flex-wrap:wrap;
}

.left-pane{ flex:1 1 260px; }
.right-pane{ width:230px; }

.chart-card{
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
}

.chart-head{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
}

.tf button{
  padding:5px 8px;
  font-size:11px;
  border-radius:8px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  color:var(--muted);
  cursor:pointer;
}

.tf button.active{
  background:rgba(255,255,255,0.10);
  color:var(--text);
}

#tvChart{ height:170px; }

.chart-toggle{
  width:100%;
  margin-top:8px;
  font-size:12px;
}
</style>
</head>

<body>
<div class="card">

  <div class="topbar">
    <button id="swapBtn" class="swap-btn">⇄</button>
  </div>

  <h1>Bitcoin Dashboard</h1>

  <div class="weather-marquee">
    <div id="weatherTrack" class="weather-track">
      BTC Dashboard · Live Price · Chart Enabled
    </div>
  </div>

  <div class="main-grid">
    <div class="left-pane">
      <div id="primaryDisplay" class="primary">-</div>
      <div id="secondaryDisplay" class="secondary">-</div>
    </div>

    <div id="rightPane" class="right-pane">
      <div class="chart-card">
        <div class="chart-head">
          <div>BTCUSD</div>
          <div class="tf">
            <button data-interval="5">5m</button>
            <button data-interval="30">30m</button>
            <button data-interval="60">1h</button>
            <button data-interval="240">4h</button>
          </div>
        </div>
        <div id="tvChart"></div>
        <button id="toggleChartBtn" class="chart-toggle">Hide chart</button>
      </div>
    </div>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
const PRICE_URL="https://api.coinbase.com/v2/prices/spot?currency=USD";
const TF_KEY="btcChartTF";
const CHART_HIDDEN_KEY="btcChartHidden";

let latestPrice="-";
let isPricePrimary=true;

let currentInterval=localStorage.getItem(TF_KEY)||"60";
let chartHidden=localStorage.getItem(CHART_HIDDEN_KEY)==="1";

function fmtTime(){
  return new Intl.DateTimeFormat("en-US",{
    hour:"2-digit",minute:"2-digit",second:"2-digit"
  }).format(new Date());
}

function render(){
  primaryDisplay.textContent=isPricePrimary?latestPrice:fmtTime();
  secondaryDisplay.textContent=isPricePrimary?"Time: "+fmtTime():"BTC: "+latestPrice;
}

async function fetchPrice(){
  const r=await fetch(PRICE_URL,{cache:"no-store"});
  const j=await r.json();
  latestPrice=new Intl.NumberFormat("en-US",{
    style:"currency",
    currency:"USD",
    maximumFractionDigits:0
  }).format(j.data.amount);
  render();
}

function buildChart(tf){
  currentInterval=tf;
  localStorage.setItem(TF_KEY,tf);
  if(chartHidden) return;
  tvChart.innerHTML="";
  new TradingView.widget({
    container_id:"tvChart",
    symbol:"COINBASE:BTCUSD",
    interval:tf,
    theme:"dark",
    autosize:true
  });
  document.querySelectorAll(".tf button").forEach(b=>{
    b.classList.toggle("active",b.dataset.interval===tf);
  });
}

document.querySelectorAll(".tf button").forEach(b=>{
  b.onclick=()=>buildChart(b.dataset.interval);
});

toggleChartBtn.onclick=()=>{
  chartHidden=!chartHidden;
  localStorage.setItem(CHART_HIDDEN_KEY,chartHidden?"1":"0");
  rightPane.style.display=chartHidden?"none":"block";
  toggleChartBtn.textContent=chartHidden?"Show chart":"Hide chart";
  if(!chartHidden) buildChart(currentInterval);
};

swapBtn.onclick=()=>{isPricePrimary=!isPricePrimary; render();};

fetchPrice();
buildChart(currentInterval);
setInterval(fetchPrice,5000);
setInterval(render,1000);
</script>
</body>
</html>
