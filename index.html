<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTC Live Price</title>

<style>
:root{
  --bg:#1f1f1f;
  --card:#252525;
  --border:#3a3a3a;
  --text:#e9e9e9;
  --muted:#b3b3b3;
  --muted2:#9a9a9a;
  --green:#0f6d3a;
  --error:#ff6b6b;
}

body{
  margin:0;
  padding:24px;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

.card{
  max-width:560px;
  margin:0 auto;
  padding:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
}

h1{
  margin:0 0 10px;
  font-size:20px;
}

/* ---------- tiny header ---------- */
.tinybar{
  font-size:12px;
  color:var(--muted2);
  margin-bottom:10px;
}

/* ---------- weather marquee ---------- */
.weather-marquee{
  position:relative;
  overflow:hidden;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:6px 0;
  margin-top:6px;
}

.weather-track{
  display:inline-flex;
  gap:28px;
  white-space:nowrap;
  will-change:transform;
  animation: scroll-left 120s linear infinite;
  color:var(--muted);
  font-size:11px;
}

.weather-item{
  display:inline-flex;
  align-items:center;
  gap:6px;
}

@keyframes scroll-left{
  from{ transform:translateX(100%); }
  to{ transform:translateX(-100%); }
}

/* accessibility */
@media (prefers-reduced-motion: reduce){
  .weather-track{
    animation:none;
  }
}

.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
  margin-top:10px;
}

.pill{
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  font-size:13px;
  color:var(--muted);
}

button{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  color:var(--text);
  cursor:pointer;
}

.price{
  font-size:44px;
  font-weight:800;
  margin:14px 0;
  color:var(--green);
}

.times{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--border);
  display:grid;
  gap:8px;
}

.time-row{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  color:var(--muted);
}

.err{
  color:var(--error);
  font-size:13px;
  margin-top:10px;
}
</style>
</head>

<body>
<div class="card">
  <h1>Bitcoin Price (BTC-USD)</h1>

  <div class="tinybar" id="todayMT">Today (MT): -</div>

  <!-- 🌤️ Weather marquee -->
  <div class="weather-marquee">
    <div id="weatherTrack" class="weather-track">
      <span class="weather-item">Loading weather…</span>
    </div>
  </div>

  <div class="row">
    <div id="status" class="pill">● Connecting…</div>
    <div id="updated" class="pill">Last updated: -</div>
    <button id="refresh">Refresh</button>
  </div>

  <div id="price" class="price">-</div>

  <div class="times">
    <div class="time-row"><span>Salt Lake City (MT)</span><span id="tMT">-</span></div>
    <div class="time-row"><span>US Eastern</span><span id="tET">-</span></div>
    <div class="time-row"><span>US Pacific</span><span id="tPT">-</span></div>
    <div class="time-row"><span>Korea (Seoul)</span><span id="tKR">-</span></div>
  </div>

  <div id="error" class="err"></div>
</div>

<script>
/* ---------------- price ---------------- */
const PRICE_URL="https://api.coinbase.com/v2/prices/spot?currency=USD";

/* ---------------- weather ---------------- */
const WX_URL="https://api.open-meteo.com/v1/forecast?latitude=40.7608&longitude=-111.8910&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America/Denver";

const wxIcon = c=>{
  c=Number(c);
  if(c===0) return "☀️";
  if(c<=3) return "☁️";
  if(c>=51 && c<=67) return "🌧️";
  if(c>=71 && c<=86) return "❄️";
  if(c>=95) return "⛈️";
  return "🌤️";
};

const wxText = c=>{
  c=Number(c);
  if(c===0) return "Clear";
  if(c<=3) return "Cloudy";
  if(c<=67) return "Rain";
  if(c<=86) return "Snow";
  if(c>=95) return "Storm";
  return "Weather";
};

const weatherTrack=document.getElementById("weatherTrack");

/* ---------------- time ---------------- */
const fmt=(tz)=>new Intl.DateTimeFormat("en-US",{timeZone:tz,weekday:"short",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true}).format(new Date());

function updateTime(){
  document.getElementById("todayMT").textContent="Today (MT): "+fmt("America/Denver");
  tMT.textContent=fmt("America/Denver");
  tET.textContent=fmt("America/New_York");
  tPT.textContent=fmt("America/Los_Angeles");
  tKR.textContent=fmt("Asia/Seoul");
}

async function fetchWeather(){
  const r=await fetch(WX_URL);
  const d=await r.json();
  const days=d.daily.time.slice(0,7);
  const html=days.map((day,i)=>`
    <span class="weather-item">
      ${wxIcon(d.daily.weather_code[i])}
      ${day.slice(5)} ${Math.round(d.daily.temperature_2m_max[i])}/${Math.round(d.daily.temperature_2m_min[i])}°
      ${wxText(d.daily.weather_code[i])}
    </span>
  `).join("");
  weatherTrack.innerHTML=html+html; // loop smoothly
}

async function fetchPrice(){
  const r=await fetch(PRICE_URL,{cache:"no-store"});
  const j=await r.json();
  price.textContent=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(j.data.amount);
  updated.textContent="Updated: "+fmt("America/Denver");
  status.textContent="● LIVE";
}

function start(){
  updateTime();
  fetchWeather();
  fetchPrice();
  setInterval(updateTime,1000);
  setInterval(fetchPrice,5000);
  setInterval(fetchWeather,10*60*1000);
}

start();
</script>
</body>
</html>
