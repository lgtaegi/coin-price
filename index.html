<!--
Version: 1.19
Date: 2026-02-01
Updated:
- Added large header animation area (uses empty space right of title) without changing overall layout
- Header animation: half-buried Bitcoin coin + pixel miner swinging pickaxe + large threatening snake (SVG + CSS)
- Kept all existing features: seamless marquee + pixel chase line, 6-hour weather cache/refresh, swap, stale, refresh icon, timezones, chart TF + hide/show persistence, cents removed
Author: lgtaegi
-->

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTC Dashboard</title>

<style>
:root{
  --bg:#1f1f1f;
  --card:#252525;
  --border:#3a3a3a;
  --text:#e9e9e9;
  --muted:#b3b3b3;
  --muted2:#9a9a9a;
  --green:#0f6d3a;
  --stale:#7a8a4a;
  --error:#ff6b6b;
  --bright:#f3f3f3;

  /* runner palette */
  --p1:#1a1a1a; --p2:#f2c9a0; --p3:#2f6fb3; --p4:#1f4f2a;
  --p5:#c9a23a; --p6:#8b5a2b; --p7:#e7e7e7; --p8:#3b3b3b;

  /* snake palette */
  --s1:#0e2b17; --s2:#1d5a31; --s3:#2e8b4d; --s4:#c94a3a; --s5:#111111;

  /* header animation palette */
  --hx1:#111111;  /* outline */
  --hx2:#f7931a;  /* coin */
  --hx3:#d97b12;  /* coin shadow */
  --hx4:#7a5a2a;  /* ground */
  --hx5:#5e4520;  /* ground dark */
  --hx6:#2f6fb3;  /* miner shirt */
  --hx7:#1f4f2a;  /* miner pants */
  --hx8:#f2c9a0;  /* miner skin */
  --hx9:#c9a23a;  /* pickaxe */
  --hx10:#1d5a31; /* big snake body */
  --hx11:#0e2b17; /* big snake outline */
  --hx12:#e7e7e7; /* sparkle */
}

body{
  margin:0;
  padding:24px;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

.card{
  max-width:560px;
  margin:0 auto;
  padding:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
}

/* ---------- HEADER LAYOUT (title + swap left, animation right) ---------- */
.header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:0 0 10px;
}

.header-left{
  display:flex;
  align-items:center;
  gap:10px;
  flex:0 0 auto;
}

h1{ margin:0; font-size:20px; white-space:nowrap; }

.swap-btn{
  font-size:12px;
  padding:4px 8px;
  border-radius:8px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  color:var(--muted);
  cursor:pointer;
  flex:0 0 auto;
}
.swap-btn:hover{ background:rgba(255,255,255,0.08); }

/* right animation box: uses the “big empty space” */
.header-anim{
  flex:1 1 auto;
  min-width:140px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
}

.header-anim svg{
  width:min(320px, 100%);
  height:34px;           /* keep layout compact */
  display:block;
  image-rendering:pixelated;
  shape-rendering:crispEdges;
  border-radius:10px;
  border:1px solid rgba(255,255,255,0.06);
  background:rgba(255,255,255,0.02);
}

/* hide animation on very small widths */
@media (max-width: 420px){
  .header-anim{ display:none; }
}

/* ---------- HEADER ANIMATION KEYFRAMES ---------- */
@keyframes minerBounce{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-1px); }
}
@keyframes pickSwing{
  0%{ transform:rotate(-18deg); }
  45%{ transform:rotate(35deg); }
  70%{ transform:rotate(5deg); }
  100%{ transform:rotate(-18deg); }
}
@keyframes coinJiggle{
  0%,100%{ transform:translateX(0); }
  40%{ transform:translateX(0); }
  50%{ transform:translateX(1px); }
  60%{ transform:translateX(0); }
}
@keyframes sparkle{
  0%,70%{ opacity:0; transform:scale(0.7); }
  80%{ opacity:1; transform:scale(1); }
  100%{ opacity:0; transform:scale(0.7); }
}
@keyframes snakeWave{
  0%,100%{ transform:translateX(0) translateY(0); }
  25%{ transform:translateX(-2px) translateY(1px); }
  50%{ transform:translateX(0) translateY(-1px); }
  75%{ transform:translateX(2px) translateY(1px); }
}
@keyframes snakeHeadThreat{
  0%,100%{ transform:translateX(0) rotate(0deg); }
  50%{ transform:translateX(-1px) rotate(-3deg); }
}

/* apply to svg internal groups */
.h-miner{ animation:minerBounce 0.55s steps(2) infinite; transform-origin: 120px 28px; }
.h-pick{ animation:pickSwing 0.85s steps(3) infinite; transform-origin: 132px 16px; }
.h-coin{ animation:coinJiggle 0.85s steps(3) infinite; transform-origin: 60px 28px; }
.h-spark{ animation:sparkle 0.85s linear infinite; transform-origin: 88px 14px; }
.h-snake{ animation:snakeWave 1.2s steps(4) infinite; transform-origin: 210px 18px; }
.h-snake-head{ animation:snakeHeadThreat 1.2s steps(4) infinite; transform-origin: 286px 14px; }

/* reduced motion */
@media (prefers-reduced-motion: reduce){
  .h-miner,.h-pick,.h-coin,.h-spark,.h-snake,.h-snake-head{ animation:none !important; }
}

/* ---------- MAIN STYLES (unchanged from prior) ---------- */
.primary{
  font-size:44px;
  font-weight:800;
  margin:14px 0 2px;
  color:var(--green);
  letter-spacing:0.2px;
  white-space:nowrap;
}
@keyframes stalePulse{ 0%,100%{opacity:1} 50%{opacity:.55} }
.primary.is-stale{ color:var(--stale); animation:stalePulse 1.4s ease-in-out infinite; }

.secondary{ font-size:13px; color:var(--muted2); }
.secondary.big{ font-size:19.5px; color:var(--muted); }

.tinybar{
  font-size:12px;
  color:var(--muted2);
  margin-bottom:6px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:baseline;
}
.stale-age{ font-size:11px; color:var(--muted); display:none; }

/* marquee */
.weather-marquee{
  overflow:hidden;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:6px 0;
  margin-bottom:10px;
  position:relative;
}
.weather-track{
  display:flex;
  width:fit-content;
  will-change:transform;
  animation:marquee 84s linear infinite;
}
@keyframes marquee{ 0%{transform:translateX(0)} 100%{transform:translateX(-50%)} }
.seg{
  display:inline-flex;
  gap:28px;
  white-space:nowrap;
  padding-right:28px;
  align-items:center;
  flex:0 0 auto;
}
.weather-item{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  color:var(--muted);
}
.filler{ color:var(--bright); opacity:0.95; }

/* chase line components (kept) */
.chase{ display:inline-flex; align-items:center; gap:8px; }
.chase-stack{ position:relative; width:120px; height:22px; display:inline-block; }
.snake{
  position:absolute; left:0; top:2px;
  width:120px; height:18px; opacity:0.9;
  image-rendering:pixelated; shape-rendering:crispEdges;
  animation:snakeChase 1.1s steps(4) infinite;
}
@keyframes snakeChase{
  0%{transform:translateX(-10px) translateY(0)}
  50%{transform:translateX(-2px) translateY(-1px)}
  100%{transform:translateX(-10px) translateY(0)}
}
.snake .tongue{ animation:tongue 0.55s steps(2) infinite; }
@keyframes tongue{ 0%,49%{opacity:0} 50%,100%{opacity:1} }

.runner{
  position:absolute; right:6px; top:0;
  display:inline-flex; align-items:center; gap:6px;
  z-index:2;
}
.runner .label{ font-size:11px; color:var(--bright); opacity:0.95; }
.pixel-svg{
  width:22px; height:22px;
  image-rendering:pixelated; shape-rendering:crispEdges;
  display:block;
  animation:runBounce 0.55s steps(2) infinite;
}
@keyframes runBounce{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1px)} }
.pixel-svg .legA{ transform-origin:8px 18px; animation:legA 0.55s steps(2) infinite; }
.pixel-svg .legB{ transform-origin:12px 18px; animation:legB 0.55s steps(2) infinite; }
@keyframes legA{ 0%,100%{transform:rotate(10deg)} 50%{transform:rotate(-12deg)} }
@keyframes legB{ 0%,100%{transform:rotate(-10deg)} 50%{transform:rotate(12deg)} }
.pixel-svg .armSword{ transform-origin:14px 10px; animation:swing 0.85s steps(3) infinite; }
@keyframes swing{ 0%{transform:rotate(-10deg)} 40%{transform:rotate(40deg)} 70%{transform:rotate(12deg)} 100%{transform:rotate(-10deg)} }

@media (prefers-reduced-motion: reduce){
  .weather-track,.primary.is-stale,.pixel-svg,.pixel-svg .legA,.pixel-svg .legB,.pixel-svg .armSword,.snake,.snake .tongue{ animation:none; }
}

.updated-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  width:100%;
}
.pill{
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  font-size:13px;
  color:var(--muted);
}
.refresh-icon-btn{
  width:34px; height:34px;
  display:inline-flex; align-items:center; justify-content:center;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  color:var(--muted);
  cursor:pointer;
  padding:0;
}
.refresh-icon-btn:hover{ background:rgba(255,255,255,0.08); }
.refresh-icon-btn:active{ transform:translateY(1px); }
.refresh-icon{ width:16px; height:16px; display:block; }

.main-grid{
  display:flex;
  gap:14px;
  align-items:flex-start;
  flex-wrap:wrap;
}
.left-pane{ flex:1 1 260px; min-width:240px; }
.right-pane{ flex:0 0 230px; width:230px; }

.times{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--border);
  display:grid;
  gap:8px;
}
.time-row{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  color:var(--muted);
}
.err{ color:var(--error); font-size:13px; margin-top:10px; white-space:pre-wrap; }

/* chart */
.chart-card{
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  background:rgba(255,255,255,0.02);
}
.chart-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}
.chart-title{ font-size:12px; color:var(--muted2); }
.tf{ display:flex; gap:6px; }
.tf button{
  padding:5px 8px;
  border-radius:8px;
  font-size:11px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  color:var(--muted);
  cursor:pointer;
}
.tf button:hover{ background:rgba(255,255,255,0.06); }
.tf button.active{ background:rgba(255,255,255,0.10); color:var(--text); }
#tvChart{ height:170px; border-radius:10px; overflow:hidden; }
.chart-toggle{
  width:100%;
  margin-top:8px;
  padding:8px 10px;
  font-size:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  color:var(--muted);
  cursor:pointer;
}
.chart-toggle:hover{ background:rgba(255,255,255,0.06); }
.right-pane.is-hidden #tvChart,
.right-pane.is-hidden .tf{ display:none; }
</style>
</head>

<body>
<div class="card">

  <div class="header">
    <div class="header-left">
      <h1>Bitcoin Dashboard</h1>
      <button id="swapBtn" class="swap-btn" title="Swap price / time">⇄</button>
    </div>

    <!-- NEW: Large header animation using the empty space -->
    <div class="header-anim" aria-hidden="true">
      <svg viewBox="0 0 320 34" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
        <!-- ground -->
        <rect x="0" y="24" width="320" height="10" fill="var(--hx4)"/>
        <rect x="0" y="28" width="320" height="6" fill="var(--hx5)"/>

        <!-- half-buried coin group -->
        <g class="h-coin">
          <!-- coin behind ground (top part visible) -->
          <g>
            <rect x="44" y="6" width="48" height="24" rx="2" ry="2" fill="var(--hx2)"/>
            <rect x="44" y="6" width="48" height="3" fill="var(--hx3)"/>
            <rect x="44" y="27" width="48" height="3" fill="var(--hx3)"/>
            <rect x="44" y="6" width="3" height="24" fill="var(--hx3)"/>
            <rect x="89" y="6" width="3" height="24" fill="var(--hx3)"/>
            <!-- simple ₿ mark -->
            <rect x="64" y="10" width="2" height="14" fill="var(--hx1)"/>
            <rect x="68" y="10" width="2" height="14" fill="var(--hx1)"/>
            <rect x="58" y="11" width="18" height="2" fill="var(--hx1)"/>
            <rect x="58" y="16" width="18" height="2" fill="var(--hx1)"/>
            <rect x="58" y="21" width="18" height="2" fill="var(--hx1)"/>
            <rect x="58" y="13" width="2" height="8" fill="var(--hx1)"/>
            <rect x="74" y="13" width="2" height="8" fill="var(--hx1)"/>
          </g>
          <!-- cover lower half with ground to appear buried -->
          <rect x="44" y="24" width="48" height="10" fill="var(--hx4)"/>
          <rect x="44" y="28" width="48" height="6" fill="var(--hx5)"/>
        </g>

        <!-- sparkle near impact -->
        <g class="h-spark">
          <rect x="98" y="8" width="2" height="2" fill="var(--hx12)"/>
          <rect x="96" y="10" width="2" height="2" fill="var(--hx12)"/>
          <rect x="100" y="10" width="2" height="2" fill="var(--hx12)"/>
          <rect x="98" y="12" width="2" height="2" fill="var(--hx12)"/>
        </g>

        <!-- miner group -->
        <g class="h-miner">
          <!-- body -->
          <rect x="120" y="10" width="14" height="10" fill="var(--hx6)"/>
          <rect x="120" y="20" width="14" height="6" fill="var(--hx7)"/>
          <!-- head -->
          <rect x="121" y="4" width="12" height="8" fill="var(--hx8)"/>
          <rect x="121" y="4" width="12" height="2" fill="var(--p6)"/>
          <!-- legs -->
          <rect x="121" y="26" width="5" height="4" fill="var(--hx1)"/>
          <rect x="129" y="26" width="5" height="4" fill="var(--hx1)"/>
          <!-- back arm -->
          <rect x="116" y="12" width="4" height="8" fill="var(--hx6)"/>
          <rect x="116" y="20" width="4" height="3" fill="var(--hx8)"/>

          <!-- pickaxe arm (animated) -->
          <g class="h-pick">
            <rect x="134" y="12" width="4" height="8" fill="var(--hx6)"/>
            <rect x="138" y="18" width="3" height="3" fill="var(--hx8)"/>
            <!-- handle -->
            <rect x="141" y="10" width="3" height="14" fill="var(--hx9)"/>
            <!-- head -->
            <rect x="137" y="9" width="12" height="3" fill="var(--hx1)"/>
            <rect x="138" y="10" width="10" height="1" fill="var(--hx9)"/>
          </g>
        </g>

        <!-- big snake behind miner -->
        <g class="h-snake" opacity="0.95">
          <!-- body segments -->
          <rect x="176" y="18" width="18" height="4" fill="var(--hx11)"/>
          <rect x="192" y="16" width="18" height="4" fill="var(--hx11)"/>
          <rect x="208" y="18" width="18" height="4" fill="var(--hx11)"/>
          <rect x="224" y="16" width="18" height="4" fill="var(--hx11)"/>
          <rect x="240" y="18" width="18" height="4" fill="var(--hx11)"/>
          <rect x="256" y="16" width="18" height="4" fill="var(--hx11)"/>

          <rect x="177" y="19" width="16" height="2" fill="var(--hx10)"/>
          <rect x="193" y="17" width="16" height="2" fill="var(--hx10)"/>
          <rect x="209" y="19" width="16" height="2" fill="var(--hx10)"/>
          <rect x="225" y="17" width="16" height="2" fill="var(--hx10)"/>
          <rect x="241" y="19" width="16" height="2" fill="var(--hx10)"/>
          <rect x="257" y="17" width="16" height="2" fill="var(--hx10)"/>

          <!-- head -->
          <g class="h-snake-head">
            <rect x="276" y="12" width="18" height="10" fill="var(--hx11)"/>
            <rect x="277" y="13" width="16" height="8" fill="var(--hx10)"/>
            <rect x="288" y="15" width="2" height="2" fill="var(--hx1)"/>
            <rect x="294" y="17" width="4" height="1" fill="var(--s4)"/>
          </g>
        </g>
      </svg>
    </div>
  </div>

  <div class="tinybar">
    <span id="todayMT">-</span>
    <span id="staleAge" class="stale-age">Last update: -</span>
  </div>

  <div class="weather-marquee">
    <div id="weatherTrack" class="weather-track">
      <div id="segA" class="seg"></div>
      <div id="segB" class="seg"></div>
    </div>
  </div>

  <div class="main-grid">
    <div class="left-pane">
      <div class="updated-row">
        <div id="updated" class="pill">Updated: -</div>
        <button id="refreshBtn" class="refresh-icon-btn" title="Refresh">
          <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M20 4v6h-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>

      <div id="primaryDisplay" class="primary">-</div>
      <div id="secondaryDisplay" class="secondary">-</div>

      <div class="times">
        <div class="time-row"><span>Salt Lake City</span><span id="tMT">-</span></div>
        <div class="time-row"><span>New York</span><span id="tNY">-</span></div>
        <div class="time-row"><span>Seoul</span><span id="tKR">-</span></div>
      </div>

      <div id="error" class="err"></div>
    </div>

    <div id="rightPane" class="right-pane">
      <div class="chart-card">
        <div class="chart-head">
          <div class="chart-title">BTCUSD Mini Chart</div>
          <div class="tf" aria-label="Timeframes">
            <button class="tf-btn" data-interval="5">5m</button>
            <button class="tf-btn" data-interval="30">30m</button>
            <button class="tf-btn" data-interval="60">1h</button>
            <button class="tf-btn" data-interval="240">4h</button>
          </div>
        </div>

        <div id="tvChart"></div>
        <button id="toggleChartBtn" class="chart-toggle">Hide chart</button>
      </div>
    </div>
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>

<script>
/* ---------- CONFIG ---------- */
const PRICE_URL="https://api.coinbase.com/v2/prices/spot?currency=USD";
const WX_URL="https://api.open-meteo.com/v1/forecast?latitude=40.7608&longitude=-111.8910&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America/Denver";

const WARN_AFTER_MS = 45_000;
const STALE_AFTER_MS = 60_000;

const TF_KEY = "btcChartTF";
const CHART_HIDDEN_KEY = "btcChartHidden";

const WX_CACHE_KEY = "wxDailyItemsHtml_v2";
const WX_CACHE_TS_KEY = "wxDailyItemsTs_v2";
const WX_REFRESH_MS = 6 * 60 * 60 * 1000; // 6 hours

const FILLER_KO = "오늘도 행복하자";
const FILLER_EN = "Let’s be happy today.";

/* ---------- STATE ---------- */
let isPricePrimary = true;
let latestPrice = "-";
let lastGoodPriceUpdate = 0;

let currentInterval = localStorage.getItem(TF_KEY) || "60";
let chartHidden = (localStorage.getItem(CHART_HIDDEN_KEY) === "1");

/* ---------- HELPERS ---------- */
const fmtTime = (tz) => new Intl.DateTimeFormat("en-US", {
  timeZone: tz, hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:true
}).format(new Date());

const fmtDateTimeNoLabel = (tz) => new Intl.DateTimeFormat("en-US", {
  timeZone: tz, weekday:"short", month:"2-digit", day:"2-digit",
  hour:"2-digit", minute:"2-digit", second:"2-digit", hour12:true
}).format(new Date());

function fmtAgo(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(s/60);
  const r = s % 60;
  return `${m}m ${String(r).padStart(2,"0")}s ago`;
}

function applySwapTypography(){
  if(isPricePrimary){
    primaryDisplay.style.fontSize = "44px";
    secondaryDisplay.classList.remove("big");
    secondaryDisplay.style.display = "none";
  } else {
    primaryDisplay.style.fontSize = "36px";
    secondaryDisplay.classList.add("big");
    secondaryDisplay.style.display = "block";
  }
}

function renderDisplays(){
  if(isPricePrimary){
    primaryDisplay.textContent = latestPrice;
    secondaryDisplay.textContent = "";
  } else {
    primaryDisplay.textContent = fmtTime("America/Denver");
    secondaryDisplay.textContent = "BTC: " + latestPrice;
  }
}

/* ---------- PIXEL CHASE LINE (kept) ---------- */
function snakeSvg(){
  return `
    <svg class="snake" viewBox="0 0 120 18" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
      <rect x="2"  y="9"  width="10" height="3" fill="var(--s1)"/>
      <rect x="10" y="7"  width="12" height="3" fill="var(--s1)"/>
      <rect x="20" y="9"  width="12" height="3" fill="var(--s1)"/>

    </span>

function fillerItemsHtml(){
  return chaseBlockHtml() + chaseBlockHtml() + chaseBlockHtml();
}

function setMarqueeSegmentHtml(segmentHtml){
  segA.innerHTML = segmentHtml;
  segB.innerHTML = segmentHtml;
}

function dayShort3(dateStr){
  const d = new Date(dateStr + "T00:00:00");
  return ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][d.getDay()];
}
function mdDate(dateStr){ return dateStr.slice(5).replace("-", "/"); }

const wxIcon = (c) => {
  c = Number(c);
  if(c === 0) return "☀️";
  if(c <= 3) return "☁️";
  if(c <= 67) return "🌧️";
  if(c <= 86) return "❄️";
  if(c >= 95) return "⛈️";
  return "🌤️";
};

function buildWeatherItemsHtml(daily){
  const days = daily.time.slice(0,7);
  const items = days.map((day,i)=>`
    <span class="weather-item">
      ${dayShort3(day)} (${mdDate(day)})
      ${wxIcon(daily.weather_code[i])}
      ${Math.round(daily.temperature_2m_max[i])}/${Math.round(daily.temperature_2m_min[i])}°
    </span>
  `).join("");
  return chaseBlockHtml() + items + chaseBlockHtml() + items;
}

/* ---------- WEATHER (6-hour cache) ---------- */
function readWxCache(){
  const ts = Number(localStorage.getItem(WX_CACHE_TS_KEY) || "0");
  const html = localStorage.getItem(WX_CACHE_KEY) || "";
  return { ts, html };
}
function writeWxCache(html){
  localStorage.setItem(WX_CACHE_KEY, html);
  localStorage.setItem(WX_CACHE_TS_KEY, String(Date.now()));
}

async function ensureWeather(){
  setMarqueeSegmentHtml(fillerItemsHtml());

  const { ts, html } = readWxCache();
  const age = Date.now() - ts;

  if (html && ts && age < WX_REFRESH_MS){
    setMarqueeSegmentHtml(html);
    return;
  }

  try{
    const r = await fetch(WX_URL, { cache:"no-store" });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();

    const built = buildWeatherItemsHtml(data.daily);
    writeWxCache(built);
    setMarqueeSegmentHtml(built);
  }catch(e){
    setMarqueeSegmentHtml(fillerItemsHtml());
  }
}

/* ---------- PRICE ---------- */
async function fetchPrice(){
  try{
    const r = await fetch(PRICE_URL, { cache:"no-store" });
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const j = await r.json();

    latestPrice = new Intl.NumberFormat("en-US", {
      style:"currency", currency:"USD", maximumFractionDigits:0
    }).format(j?.data?.amount);

    lastGoodPriceUpdate = Date.now();
    updated.textContent = "Updated: " + fmtTime("America/Denver") + " (MT)";
    error.textContent = "";

    renderDisplays();
    updateStaleUI();
  }catch(e){
    error.textContent = "Error: " + (e?.message || String(e));
  }
}

/* ---------- TIMEZONES ---------- */
function updateTime(){
  todayMT.textContent = fmtDateTimeNoLabel("America/Denver");
  tMT.textContent = fmtTime("America/Denver");
  tNY.textContent = fmtTime("America/New_York");
  tKR.textContent = fmtTime("Asia/Seoul");
  renderDisplays();
}

/* ---------- STALE UI ---------- */
function updateStaleUI(){
  const now = Date.now();
  const base = lastGoodPriceUpdate || now;
  const elapsed = now - base;

  if(elapsed >= WARN_AFTER_MS){
    staleAge.style.display = "inline";
    staleAge.textContent = "Last update: " + fmtAgo(elapsed);
  } else {
    staleAge.style.display = "none";
  }

  if(elapsed >= STALE_AFTER_MS){
    primaryDisplay.classList.add("is-stale");
  } else {
    primaryDisplay.classList.remove("is-stale");
  }
}

/* ---------- CHART (TradingView embed) ---------- */
function setActiveTf(interval){
  document.querySelectorAll(".tf-btn").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.interval === String(interval));
  });
}

function buildTVChart(interval){
  currentInterval = String(interval);
  localStorage.setItem(TF_KEY, currentInterval);
  setActiveTf(currentInterval);

  if(chartHidden) return;

  const el = document.getElementById("tvChart");
  el.innerHTML = "";

  const innerId = "tv_inner_" + Date.now();
  const inner = document.createElement("div");
  inner.id = innerId;
  inner.style.height = "170px";
  el.appendChild(inner);

  new TradingView.widget({
    autosize:true,
    symbol:"COINBASE:BTCUSD",
    interval:currentInterval,
    timezone:"America/Denver",
    theme:"dark",
    style:"1",
    locale:"en",
    enable_publishing:false,
    hide_legend:true,
    hide_side_toolbar:true,
    allow_symbol_change:false,
    container_id:innerId,
    save_image:false,
    studies:[],
    withdateranges:false,
    details:false,
    calendar:false
  });
}

function setChartHidden(next){
  chartHidden = next;
  localStorage.setItem(CHART_HIDDEN_KEY, chartHidden ? "1" : "0");

  rightPane.classList.toggle("is-hidden", chartHidden);
  toggleChartBtn.textContent = chartHidden ? "Show chart" : "Hide chart";

  if(!chartHidden){
    if (window.TradingView && TradingView.widget) buildTVChart(currentInterval);
  } else {
    tvChart.innerHTML = "";
  }
}

document.querySelectorAll(".tf-btn").forEach(btn=>{
  btn.addEventListener("click", () => buildTVChart(btn.dataset.interval));
});

toggleChartBtn.addEventListener("click", ()=>{
  setChartHidden(!chartHidden);
});

/* ---------- EVENTS ---------- */
swapBtn.addEventListener("click", ()=>{
  isPricePrimary = !isPricePrimary;
  applySwapTypography();
  renderDisplays();
  updateStaleUI();
});

refreshBtn.addEventListener("click", ()=>{
  fetchPrice();
  ensureWeather();
});

/* ---------- START ---------- */
function start(){
  setMarqueeSegmentHtml(fillerItemsHtml());

  applySwapTypography();
  renderDisplays();

  updateTime();
  fetchPrice();
  ensureWeather();

  setChartHidden(chartHidden);
  setActiveTf(currentInterval);

  const bootChart = () => { if(!chartHidden) buildTVChart(currentInterval); };

  if (window.TradingView && TradingView.widget) {
    bootChart();
  } else {
    const t = setInterval(() => {
      if (window.TradingView && TradingView.widget) {
        clearInterval(t);
        bootChart();
      }
    }, 150);
  }

  setInterval(updateTime, 1000);
  setInterval(fetchPrice, 5000);
  setInterval(updateStaleUI, 1000);
  setInterval(ensureWeather, WX_REFRESH_MS);
}

start();
</script>
