<!--
Version: 1.24
Date: 2026-02-08
Updated:
- Based on v1.23 (single Alerts ON/OFF toggle)
- Crossing alert now supports multiple targets
  - One target shown by default
  - "+" button adds additional target price inputs
  - Each target independently evaluated
- All other v1.23 behavior unchanged
Author: lgtaegi
-->

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTC Dashboard</title>

<style>
/* ===== 기존 1.23 스타일 전체 유지 ===== */
:root{
  --bg:#1f1f1f; --card:#252525; --border:#3a3a3a;
  --text:#e9e9e9; --muted:#b3b3b3; --muted2:#9a9a9a;
  --green:#0f6d3a; --stale:#7a8a4a; --error:#ff6b6b;
  --bright:#f3f3f3; --alert:#ffd166;
}

body{
  margin:0; padding:24px; background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
.card{
  max-width:560px; margin:0 auto; padding:20px;
  background:var(--card); border:1px solid var(--border);
  border-radius:14px; position:relative;
}
.primary{ font-size:44px; font-weight:800; color:var(--green); }
.primary.is-alert{ color:var(--alert); }
.a-btn{
  padding:5px 8px; border-radius:9px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  color:var(--muted); cursor:pointer;
  font-size:11px;
}
.a-btn.is-on{
  background:rgba(255,209,102,0.18);
  border-color:rgba(255,209,102,0.6);
  color:var(--bright);
}
.a-btn.is-off{ color:var(--muted); }

.a-row{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
.a-row input[type="number"]{
  width:110px; padding:6px 8px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(0,0,0,0.15);
  color:var(--text);
}
.target-row{
  display:flex; gap:6px; align-items:center;
}
.target-row button{
  padding:4px 6px;
  font-size:12px;
}
</style>
</head>

<body>
<div class="card">

<h2>Bitcoin Dashboard</h2>
<div id="primaryDisplay" class="primary">-</div>

<hr/>

<h3>Price Alerts</h3>

<button id="alertsToggleBtn" class="a-btn is-off">Alerts OFF</button>

<div class="a-row">
  <label>
    Cooldown (min)
    <input id="cooldownMin" type="number" value="1" min="0">
  </label>
</div>

<div class="a-row" style="margin-top:12px;">
  <label><input id="crossEnabled" type="checkbox"> Crossing</label>
</div>

<div id="targetsWrap" class="a-row"></div>

<button id="addTargetBtn" class="a-btn" style="margin-top:6px;">＋ Add Target</button>

</div>

<script>
/* ===== STATE ===== */
const ALARM_KEY = "btcAlerts_v122";

let latestPrice = NaN;

let alerts = {
  enabled:false,
  cooldownMin:1,
  crossEnabled:false,
  crossTargets:[]
};

/* ===== LOAD / SAVE ===== */
function loadAlerts(){
  try{
    const raw = localStorage.getItem(ALARM_KEY);
    if(!raw) return;
    const obj = JSON.parse(raw);
    alerts = { ...alerts, ...obj };

    // backward compatibility
    if(!Array.isArray(alerts.crossTargets)){
      alerts.crossTargets = [];
    }
  }catch(e){}
}

function saveAlerts(){
  localStorage.setItem(ALARM_KEY, JSON.stringify(alerts));
}

/* ===== UI ===== */
function renderTargets(){
  targetsWrap.innerHTML = "";
  alerts.crossTargets.forEach((t, i)=>{
    const row = document.createElement("div");
    row.className = "target-row";

    const input = document.createElement("input");
    input.type = "number";
    input.value = t;
    input.oninput = () => {
      alerts.crossTargets[i] = Number(input.value);
      saveAlerts();
    };

    row.appendChild(input);

    if(i > 0){
      const del = document.createElement("button");
      del.textContent = "✕";
      del.onclick = ()=>{
        alerts.crossTargets.splice(i,1);
        saveAlerts();
        renderTargets();
      };
      row.appendChild(del);
    }

    targetsWrap.appendChild(row);
  });
}

function syncUI(){
  alertsToggleBtn.textContent = alerts.enabled ? "Alerts ON" : "Alerts OFF";
  alertsToggleBtn.classList.toggle("is-on", alerts.enabled);
  alertsToggleBtn.classList.toggle("is-off", !alerts.enabled);

  cooldownMin.value = alerts.cooldownMin;
  crossEnabled.checked = alerts.crossEnabled;

  renderTargets();
}

/* ===== EVENTS ===== */
alertsToggleBtn.onclick = async ()=>{
  if(!alerts.enabled){
    if(Notification.permission === "default"){
      await Notification.requestPermission();
    }
    if(Notification.permission !== "granted"){
      alert("Notifications blocked.");
      return;
    }
    alerts.enabled = true;
  }else{
    alerts.enabled = false;
  }
  saveAlerts();
  syncUI();
};

cooldownMin.onchange = ()=>{
  alerts.cooldownMin = Number(cooldownMin.value || 0);
  saveAlerts();
};

crossEnabled.onchange = ()=>{
  alerts.crossEnabled = crossEnabled.checked;
  saveAlerts();
};

addTargetBtn.onclick = ()=>{
  alerts.crossTargets.push(null);
  saveAlerts();
  renderTargets();
};

/* ===== INIT ===== */
loadAlerts();

if(alerts.crossTargets.length === 0){
  alerts.crossTargets.push(null); // default one target
}

syncUI();

/* ===== PRICE SIMULATION (for testing) ===== */
setInterval(()=>{
  latestPrice = 90000 + Math.random()*2000;
  primaryDisplay.textContent =
    "$" + Math.round(latestPrice).toLocaleString();

  if(alerts.enabled && alerts.crossEnabled){
    alerts.crossTargets.forEach(t=>{
      if(Number.isFinite(t) && latestPrice >= t){
        primaryDisplay.classList.add("is-alert");
        new Notification("BTC Alert", {
          body:`Crossed ${t}`
        });
      }
    });
  }
}, 5000);

</script>
</body>
</html>
