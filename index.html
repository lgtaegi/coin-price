<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTC Dashboard</title>

<style>
:root{
  --bg:#1f1f1f;
  --card:#252525;
  --border:#3a3a3a;
  --text:#e9e9e9;
  --muted:#b3b3b3;
  --green:#0f6d3a;
  --alert:#ffd166;
  --warn:#ff6b6b;
}

/* ---------- BASE ---------- */
body{
  margin:0;
  padding:24px;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
.card{
  max-width:560px;
  margin:auto;
  padding:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
}

/* ---------- ALERT PANEL ---------- */
.alert-panel{
  border:1px solid var(--border);
  border-radius:12px;
  padding:12px;
  background:rgba(255,255,255,0.02);
}
.alert-panel.armed{
  border-color:var(--green);
  box-shadow:0 0 0 2px rgba(15,109,58,.18) inset;
}

.alert-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.alert-title{
  font-size:12px;
  color:var(--muted);
  display:flex;
  align-items:center;
  gap:8px;
}
.alert-title .dot{
  width:8px;height:8px;border-radius:50%;
  background:#666;
}
.alert-panel.armed .dot{ background:var(--green); }

.alert-btn{
  padding:6px 12px;
  font-size:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:#2a2a2a;
  color:var(--muted);
  cursor:pointer;
}
.alert-btn:hover{ background:#333; }

.alert-btn.on{
  background:rgba(255,209,102,.22);
  border-color:var(--alert);
  color:#fff;
}
.alert-btn.warn{
  background:rgba(255,107,107,.25);
  border-color:var(--warn);
  color:#fff;
}

/* ---------- ALERT OPTIONS ---------- */
.a-row{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
}
.a-row input{
  width:90px;
  padding:4px 6px;
  border-radius:8px;
  border:1px solid var(--border);
  background:rgba(0,0,0,.2);
  color:var(--text);
}
</style>
</head>

<body>
<div class="card">

<h2>Bitcoin Dashboard</h2>

<div id="alertPanel" class="alert-panel">
  <div class="alert-head">
    <div class="alert-title">
      <span class="dot"></span>
      Price Alerts
    </div>
    <button id="alertsBtn" class="alert-btn">Enable Alerts</button>
  </div>

  <div class="a-row">
    Cooldown (min)
    <input id="cooldownMin" type="number" min="0" step="1" value="5">
  </div>
</div>

</div>

<script>
/* ---------- STATE ---------- */
const alerts = {
  enabled:false,
  cooldownMin:5
};

const alertsBtn = document.getElementById("alertsBtn");
const alertPanel = document.getElementById("alertPanel");
const cooldownMin = document.getElementById("cooldownMin");

/* ---------- UI ---------- */
function refreshAlertsUI(){
  alertsBtn.className = "alert-btn";
  alertPanel.classList.toggle("armed", alerts.enabled);

  if(!("Notification" in window)){
    alertsBtn.textContent = "No Notifications";
    alertsBtn.disabled = true;
    return;
  }

  if(Notification.permission === "denied"){
    alerts.enabled = false;
    alertsBtn.textContent = "Blocked ✕";
    alertsBtn.classList.add("warn");
    return;
  }

  if(alerts.enabled){
    alertsBtn.textContent = "Alerts ON";
    alertsBtn.classList.add("on");
  }else{
    alertsBtn.textContent = "Alerts OFF";
  }
}

/* ---------- EVENTS ---------- */
alertsBtn.addEventListener("click", async ()=>{
  if(!("Notification" in window)) return;

  if(Notification.permission === "default"){
    await Notification.requestPermission();
  }

  if(Notification.permission === "granted"){
    alerts.enabled = !alerts.enabled; // ⭐ 토글
  }else{
    alerts.enabled = false;
  }

  refreshAlertsUI();
});

cooldownMin.addEventListener("change", ()=>{
  alerts.cooldownMin = Math.max(0, Number(cooldownMin.value || 0));
});

/* ---------- START ---------- */
refreshAlertsUI();
</script>
</body>
</html>
