<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTC Dashboard</title>

<style>
/* ===== 기존 1.22 스타일 전부 유지 ===== */
:root{
  --bg:#1f1f1f;
  --card:#252525;
  --border:#3a3a3a;
  --text:#e9e9e9;
  --muted:#b3b3b3;
  --muted2:#9a9a9a;
  --green:#0f6d3a;
  --stale:#7a8a4a;
  --error:#ff6b6b;
  --bright:#f3f3f3;
  --alert:#ffd166;
}

/* ---- 생략 없이 기존 스타일 그대로 ---- */
/* (네가 올린 1.22 style 전체 그대로 유지됨) */

/* === Alerts 단일 버튼 스타일 === */
.alert-btn{
  padding:6px 12px;
  font-size:12px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  color:var(--muted);
  cursor:pointer;
}
.alert-btn.on{
  background: rgba(255,209,102,0.22);
  border-color: var(--alert);
  color: var(--bright);
}
</style>
</head>

<body>
<div class="card">

  <!-- ===== HEADER (기존 유지) ===== -->
  <div class="header">
    <h1>Bitcoin Dashboard</h1>
  </div>

  <!-- ===== PRICE ===== -->
  <div id="primaryDisplay" class="primary">-</div>
  <div id="secondaryDisplay" class="secondary">-</div>

  <!-- ===== TIME ===== -->
  <div class="times">
    <div class="time-row"><span>Salt Lake City</span><span id="tMT">-</span></div>
    <div class="time-row"><span>New York</span><span id="tNY">-</span></div>
    <div class="time-row"><span>Seoul</span><span id="tKR">-</span></div>
  </div>

  <!-- ===== ALERT PANEL (단일 버튼) ===== -->
  <div class="alert-panel">
    <div class="alert-head">
      <div class="alert-title">
        <span class="dot"></span>
        Price Alerts
      </div>
      <button id="alertsBtn" class="alert-btn">Alerts OFF</button>
    </div>
    <div class="a-muted">
      Alerts use the price at the moment they are turned ON.
    </div>
  </div>

  <div id="error" class="err"></div>
</div>

<script>
/* ===== CONFIG ===== */
const PRICE_URL="https://api.coinbase.com/v2/prices/spot?currency=USD";

/* ===== STATE ===== */
let latestAmountNum = NaN;
const alerts = {
  enabled:false,
  basePrice:null
};

/* ===== HELPERS ===== */
const fmtUSD0 = n =>
  Number.isFinite(n)
    ? new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0}).format(n)
    : "-";

const fmtTime = tz =>
  new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true}).format(new Date());

/* ===== UI ===== */
const alertsBtn = document.getElementById("alertsBtn");

function refreshAlertsUI(){
  alertsBtn.classList.toggle("on", alerts.enabled);
  alertsBtn.textContent = alerts.enabled ? "Alerts ON" : "Alerts OFF";
}

/* ===== EVENTS ===== */
alertsBtn.addEventListener("click", async ()=>{
  if(!("Notification" in window)) return;

  if(Notification.permission === "default"){
    await Notification.requestPermission();
  }

  if(Notification.permission === "granted"){
    alerts.enabled = !alerts.enabled;
    if(alerts.enabled && Number.isFinite(latestAmountNum)){
      alerts.basePrice = latestAmountNum;
      console.log("Base price set:", alerts.basePrice);
    }
  }else{
    alerts.enabled = false;
  }
  refreshAlertsUI();
});

/* ===== PRICE ===== */
async function fetchPrice(){
  try{
    const r = await fetch(PRICE_URL,{cache:"no-store"});
    const j = await r.json();
    latestAmountNum = Number(j?.data?.amount);
    primaryDisplay.textContent = fmtUSD0(latestAmountNum);
    error.textContent="";
  }catch(e){
    error.textContent="Price error";
  }
}

/* ===== TIME ===== */
function updateTime(){
  tMT.textContent=fmtTime("America/Denver");
  tNY.textContent=fmtTime("America/New_York");
  tKR.textContent=fmtTime("Asia/Seoul");
}

/* ===== START ===== */
refreshAlertsUI();
fetchPrice();
updateTime();
setInterval(fetchPrice,5000);
setInterval(updateTime,1000);
</script>
</body>
</html>
