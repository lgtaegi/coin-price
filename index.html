<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BTC Dashboard</title>

<style>
:root{
  --bg:#1f1f1f;
  --card:#252525;
  --border:#3a3a3a;
  --text:#e9e9e9;
  --muted:#b3b3b3;
  --muted2:#9a9a9a;
  --green:#0f6d3a;
  --stale:#7a8a4a; /* toned-down olive/green for stale */
  --error:#ff6b6b;
}

body{
  margin:0;
  padding:24px;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}

.card{
  max-width:560px;
  margin:0 auto;
  padding:20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:14px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.swap-btn{
  font-size:12px;
  padding:4px 8px;
  border-radius:8px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  color:var(--muted);
  cursor:pointer;
}
.swap-btn:hover{
  background:rgba(255,255,255,0.08);
}

h1{
  margin:6px 0 10px;
  font-size:20px;
}

.primary{
  font-size:44px;
  font-weight:800;
  margin:14px 0 2px;
  color:var(--green);
}

.secondary{
  font-size:13px;
  color:var(--muted2);
}

.tinybar{
  font-size:12px;
  color:var(--muted2);
  margin-bottom:6px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  align-items:baseline;
}

.stale-age{
  font-size:11px;
  color:var(--muted);
  display:none; /* hidden until needed */
}

/* weather marquee */
.weather-marquee{
  overflow:hidden;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
  padding:6px 0;
  margin-bottom:10px;
}

.weather-track{
  display:inline-flex;
  gap:28px;
  white-space:nowrap;
  animation:scroll-left 84s linear infinite; /* 1/3 speed */
  font-size:11px;
  color:var(--muted);
}

.weather-item{
  display:inline-flex;
  align-items:center;
  gap:6px;
}

@keyframes scroll-left{
  from{transform:translateX(100%);}
  to{transform:translateX(-100%);}
}

@media (prefers-reduced-motion: reduce){
  .weather-track{animation:none;}
}

/* stale pulse on primary display only (subtle) */
@keyframes stalePulse{
  0%,100%{opacity:1}
  50%{opacity:.55}
}

.primary.is-stale{
  color:var(--stale);
  animation:stalePulse 1.4s ease-in-out infinite;
}

@media (prefers-reduced-motion: reduce){
  .primary.is-stale{animation:none;}
}

.row{
  display:flex;
  gap:12px;
  flex-wrap:wrap;
  align-items:center;
}

.pill{
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  font-size:13px;
  color:var(--muted);
}

button{
  padding:10px 14px;
  border-radius:10px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.04);
  color:var(--text);
  cursor:pointer;
}

.times{
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--border);
  display:grid;
  gap:8px;
}

.time-row{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  color:var(--muted);
}

.err{
  color:var(--error);
  font-size:13px;
  margin-top:10px;
  white-space:pre-wrap;
}

/* ---------- chart add-on (B option) ---------- */
.main-grid{
  display:flex;
  gap:14px;
  align-items:flex-start;
  flex-wrap:wrap;
}

.left-pane{
  flex:1 1 260px;
  min-width:240px;
}

.right-pane{
  flex:0 0 230px;
  width:230px;
}

.chart-card{
  border:1px solid var(--border);
  border-radius:12px;
  padding:10px;
  background:rgba(255,255,255,0.02);
}

.chart-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:8px;
}

.chart-title{
  font-size:12px;
  color:var(--muted2);
}

.tf{
  display:flex;
  gap:6px;
}

.tf button{
  padding:5px 8px;
  border-radius:8px;
  font-size:11px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.03);
  color:var(--muted);
}

.tf button:hover{
  background:rgba(255,255,255,0.06);
}

.tf button.active{
  background:rgba(255,255,255,0.10);
  color:var(--text);
}

#tvChart{
  height:170px;
  border-radius:10px;
  overflow:hidden;
}
</style>
</head>

<body>
<div class="card">

  <div class="topbar">
    <div style="height:1px;"></div>
    <button id="swapBtn" class="swap-btn" title="Swap price / time">⇄</button>
  </div>

  <h1>Bitcoin Dashboard</h1>

  <div class="tinybar">
    <span id="todayMT">Today (MT): -</span>
    <span id="staleAge" class="stale-age">Last update: -</span>
  </div>

  <div class="weather-marquee">
    <div id="weatherTrack" class="weather-track">
      <span class="weather-item">Loading weather…</span>
    </div>
  </div>

  <div class="main-grid">
    <!-- LEFT: your existing BTC/time area (unchanged logic) -->
    <div class="left-pane">
      <div class="row">
        <div id="status" class="pill">● Connecting…</div>
        <div id="updated" class="pill">Last updated: -</div>
        <button id="refresh">Refresh</button>
      </div>

      <div id="primaryDisplay" class="primary">-</div>
      <div id="secondaryDisplay" class="secondary">-</div>

      <div class="times">
        <div class="time-row"><span>Salt Lake City (MT)</span><span id="tMT">-</span></div>
        <div class="time-row"><span>US Eastern</span><span id="tET">-</span></div>
        <div class="time-row"><span>US Pacific</span><span id="tPT">-</span></div>
        <div class="time-row"><span>Korea (Seoul)</span><span id="tKR">-</span></div>
      </div>

      <div id="error" class="err"></div>
    </div>

    <!-- RIGHT: chart add-on only -->
    <div class="right-pane">
      <div class="chart-card">
        <div class="chart-head">
          <div class="chart-title">BTCUSD Mini Chart</div>
          <div class="tf" aria-label="Timeframes">
            <button class="tf-btn" data-interval="5">5m</button>
            <button class="tf-btn" data-interval="30">30m</button>
            <button class="tf-btn" data-interval="60">1h</button>
            <button class="tf-btn" data-interval="240">4h</button>
          </div>
        </div>

        <div id="tvChart"></div>
      </div>
    </div>
  </div>
</div>

<!-- TradingView library (embed option B) -->
<script src="https://s3.tradingview.com/tv.js"></script>

<script>
/* ---------- CONFIG ---------- */
const PRICE_URL="https://api.coinbase.com/v2/prices/spot?currency=USD";
const WX_URL="https://api.open-meteo.com/v1/forecast?latitude=40.7608&longitude=-111.8910&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=America/Denver";

/* stale thresholds */
const WARN_AFTER_MS = 45_000;  // show "Last update: ..." after 45s
const STALE_AFTER_MS = 60_000; // stale mode after 60s

let isPricePrimary=true;
let latestPrice="-";

/* Track last successful price updates */
let lastGoodPriceUpdate = 0;

/* ---------- HELPERS ---------- */
const fmtTime=(tz)=>new Intl.DateTimeFormat("en-US",{timeZone:tz,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true}).format(new Date());
const fmtDateTime=(tz)=>new Intl.DateTimeFormat("en-US",{timeZone:tz,weekday:"short",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true}).format(new Date());

function dayInitial(dateStr){
  const d=new Date(dateStr+"T00:00:00");
  return ["Su","M","T","W","Th","F","Sa"][d.getDay()];
}

function fmtAgo(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  const m = Math.floor(s/60);
  const r = s % 60;
  return `${m}m ${String(r).padStart(2,"0")}s ago`;
}

function renderDisplays(){
  if(isPricePrimary){
    primaryDisplay.textContent=latestPrice;
    secondaryDisplay.textContent="Time (MT): "+fmtTime("America/Denver");
  }else{
    primaryDisplay.textContent=fmtTime("America/Denver");
    secondaryDisplay.textContent="BTC: "+latestPrice;
  }
}

/* ---------- WEATHER ---------- */
const wxIcon=c=>{
  c=Number(c);
  if(c===0) return "☀️";
  if(c<=3) return "☁️";
  if(c<=67) return "🌧️";
  if(c<=86) return "❄️";
  if(c>=95) return "⛈️";
  return "🌤️";
};

async function fetchWeather(){
  try{
    const r=await fetch(WX_URL);
    const d=await r.json();
    const days=d.daily.time.slice(0,7);

    weatherTrack.innerHTML =
      days.map((day,i)=>`
        <span class="weather-item">
          ${dayInitial(day)}
          ${wxIcon(d.daily.weather_code[i])}
          ${Math.round(d.daily.temperature_2m_max[i])}/${Math.round(d.daily.temperature_2m_min[i])}°
        </span>
      `).join("") + weatherTrack.innerHTML;
  }catch(e){
    // keep weather failure quiet
  }
}

/* ---------- PRICE ---------- */
async function fetchPrice(){
  try{
    const r=await fetch(PRICE_URL,{cache:"no-store"});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const j=await r.json();

    latestPrice=new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(j.data.amount);
    updated.textContent="Updated: "+fmtTime("America/Denver")+" (MT)";
    status.textContent="● LIVE";
    error.textContent="";

    lastGoodPriceUpdate = Date.now(); // ✅ success timestamp
    renderDisplays();
    updateStaleUI();
  }catch(e){
    status.textContent = "○ Retrying";
    error.textContent = "Error: " + (e?.message || String(e));
  }
}

/* ---------- TIME ---------- */
function updateTime(){
  todayMT.textContent="Today (MT): "+fmtDateTime("America/Denver");
  tMT.textContent=fmtTime("America/Denver");
  tET.textContent=fmtTime("America/New_York");
  tPT.textContent=fmtTime("America/Los_Angeles");
  tKR.textContent=fmtTime("Asia/Seoul");
  renderDisplays();
}

/* ---------- STALE UI (mix of 1/2/3) ---------- */
function updateStaleUI(){
  const now = Date.now();
  const base = lastGoodPriceUpdate || now;
  const elapsed = now - base;

  if(elapsed >= WARN_AFTER_MS){
    staleAge.style.display = "inline";
    staleAge.textContent = "Last update: " + fmtAgo(elapsed);
  }else{
    staleAge.style.display = "none";
  }

  if(elapsed >= STALE_AFTER_MS){
    status.textContent = "○ STALE (delay)";
    primaryDisplay.classList.add("is-stale");
  }else{
    if(lastGoodPriceUpdate){
      status.textContent = "● LIVE";
    }
    primaryDisplay.classList.remove("is-stale");
  }
}

/* ---------- CHART (TradingView embed) ---------- */
let currentInterval = "60"; // default 1h

function setActiveTf(interval){
  document.querySelectorAll(".tf-btn").forEach(btn=>{
    btn.classList.toggle("active", btn.dataset.interval === String(interval));
  });
}

function buildTVChart(interval){
  currentInterval = String(interval);
  setActiveTf(currentInterval);

  // clear container
  const el = document.getElementById("tvChart");
  el.innerHTML = "";

  // create a unique container id each time to avoid tv.js collisions
  const innerId = "tv_inner_" + Date.now();
  const inner = document.createElement("div");
  inner.id = innerId;
  inner.style.height = "170px";
  el.appendChild(inner);

  // TradingView widget
  // Note: interval values are in minutes for intraday, e.g. 5, 30, 60, 240
  new TradingView.widget({
    autosize: true,
    symbol: "COINBASE:BTCUSD",
    interval: currentInterval,
    timezone: "America/Denver",
    theme: "dark",
    style: "1",
    locale: "en",
    enable_publishing: false,
    hide_legend: true,
    hide_side_toolbar: true,
    allow_symbol_change: false,
    container_id: innerId,
    save_image: false,
    studies: [],
    withdateranges: false,
    details: false,
    calendar: false
  });
}

document.querySelectorAll(".tf-btn").forEach(btn=>{
  btn.addEventListener("click", () => buildTVChart(btn.dataset.interval));
});

/* ---------- EVENTS ---------- */
swapBtn.addEventListener("click",()=>{
  isPricePrimary=!isPricePrimary;
  renderDisplays();
  updateStaleUI();
});

refresh.addEventListener("click",()=>{
  fetchPrice();
  fetchWeather();
});

/* ---------- START ---------- */
function start(){
  updateTime();
  fetchPrice();
  fetchWeather();

  // chart (default 1h)
  if (window.TradingView && TradingView.widget) {
    buildTVChart(currentInterval);
  } else {
    // fallback if tv.js loads slowly
    const t = setInterval(() => {
      if (window.TradingView && TradingView.widget) {
        clearInterval(t);
        buildTVChart(currentInterval);
      }
    }, 150);
  }

  setInterval(updateTime,1000);
  setInterval(fetchPrice,5000);
  setInterval(fetchWeather,10*60*1000);
  setInterval(updateStaleUI,1000);
}

start();
</script>
</body>
</html>
